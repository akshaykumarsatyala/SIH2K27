// ══════════════════════════════════════════
// EARLY OUTBREAK PREDICTION — weather + season + history based risk score
// This is separate from getOutbreaks() below: getOutbreaks() only reacts
// AFTER 3+ reports already came in for a district. predictOutbreakRisk()
// runs on live weather (temp/humidity/rain) + current agri season +
// recent report history, so it can warn a farmer BEFORE an outbreak is
// actually confirmed on the ground.
// ══════════════════════════════════════════

// Rough environmental triggers per pest, used to score how favourable
// current conditions are — same idea as CROP_PESTS (crop → likely pests)
// but keyed by the weather trigger instead.
const PEST_CONDITIONS = {
  "Brown Planthopper": {minHumidity:75, minTemp:26, maxTemp:32, minRain:40},
  "Stem Borer":         {minHumidity:70, minTemp:25, maxTemp:34, minRain:25},
  "Gall Midge":         {minHumidity:75, minTemp:24, maxTemp:30, minRain:40},
  "Leaf Folder":        {minHumidity:70, minTemp:26, maxTemp:33, minRain:30},
  "Thrips":             {minHumidity:0,  minTemp:32, maxTemp:42, maxRain:20},
  "Mites":              {minHumidity:0,  minTemp:33, maxTemp:42, maxRain:15},
  "Whitefly":           {minHumidity:40, minTemp:28, maxTemp:38, maxRain:25},
  "Aphids":             {minHumidity:50, minTemp:20, maxTemp:30, maxRain:30},
  "Bollworm":           {minHumidity:50, minTemp:27, maxTemp:35, minRain:20},
  "Fall Armyworm":      {minHumidity:55, minTemp:24, maxTemp:32, minRain:20},
  "Jassids":            {minHumidity:45, minTemp:28, maxTemp:36, maxRain:25},
  "Mealy Bug":          {minHumidity:0,  minTemp:30, maxTemp:40, maxRain:15},
  "Leaf Miner":         {minHumidity:40, minTemp:26, maxTemp:34, maxRain:30},
  "Woolly Aphid":       {minHumidity:50, minTemp:22, maxTemp:30, maxRain:35},
  "Root Grub":          {minHumidity:60, minTemp:24, maxTemp:32, minRain:30},
};

// Kharif (Jun–Oct), Rabi (Nov–Feb), Zaid/summer (Mar–May) — standard
// Indian agricultural season bands, derived from today's date.
function currentSeason() {
  const m = new Date().getMonth() + 1;
  if (m >= 6 && m <= 10) return 'Kharif';
  if (m >= 11 || m <= 2) return 'Rabi';
  return 'Zaid';
}

// Scores every pest likely on `crop` against live weather for `district`,
// nudged by how often that pest has already been reported there. Returns
// the single highest-risk pest, or null if conditions are too mild to
// warrant a warning.
function predictOutbreakRisk({ wx, crop, district, reports }) {
  if (!wx) return null;
  const pool = CROP_PESTS[crop] || PEST_TYPES;
  const season = currentSeason();

  const scored = pool.map(pest => {
    const c = PEST_CONDITIONS[pest] || {};
    let score = 0;
    if (c.minHumidity != null && wx.humidity >= c.minHumidity) score += 25;
    if (c.minTemp != null && c.maxTemp != null && wx.temp >= c.minTemp && wx.temp <= c.maxTemp) score += 25;
    if (c.minRain != null && wx.rain >= c.minRain) score += 20;
    if (c.maxRain != null && wx.rain <= c.maxRain) score += 20;
    // Pests already sighted nearby under similar conditions are more
    // likely to spread further — recent history nudges the score up.
    const priorHits = reports.filter(r => r.district === district && r.pest === pest).length;
    score += Math.min(20, priorHits * 7);
    return { pest, score };
  }).sort((a, b) => b.score - a.score);

  const top = scored[0];
  if (!top || top.score < 45) return null;
  const level = top.score >= 75 ? 'high' : top.score >= 55 ? 'medium' : 'low';
  return { pest: top.pest, crop, score: top.score, level, season };
}

// Shared outbreak calculation (used by Pest Map AND the Home-page Early
// Warning panel) so both read the same live data instead of duplicating
// the district/pest tallying logic in two places.
function getOutbreaks(reports) {
  const counts = reports.reduce((acc, r) => { acc[r.district] = (acc[r.district] || 0) + 1; return acc; }, {});
  const byPest = reports.reduce((acc, r) => {
    if (!acc[r.district]) acc[r.district] = {};
    acc[r.district][r.pest] = (acc[r.district][r.pest] || 0) + 1;
    return acc;
  }, {});
  const topPest = d => {
    const p = byPest[d];
    return p ? Object.entries(p).sort(([,a],[,b])=>b-a)[0][0] : '';
  };
  return Object.entries(counts)
    .filter(([, c]) => c >= 3)
    .sort(([, a], [, b]) => b - a)
    .map(([district, count]) => ({ district, count, pest: topPest(district) }));
}

function PestMap({ lang, showToast, reports, setReports }) {
  const TE = lang === 'TE';
  const mapRef    = useRef(null);
  const mapInst   = useRef(null);
  const heatInst  = useRef(null);
  const markerGrp = useRef(null);
  const [viewTab, setViewTab]   = useState('map');   // 'map' | 'report' | 'alerts'
  const [form, setForm]         = useState({ district:'Guntur', crop:'Chilli', pest:'Thrips', severity:'3' });
  const [submitted, setSubmitted] = useState(false);
  const [filterCrop, setFilterCrop] = useState('All');
  const [filterPest, setFilterPest] = useState('All');
  const leafletLoaded = useRef(false);

  // ── Photo-based pest identification (Report Pest tab) ──
  const [idPhoto, setIdPhoto]           = useState(null);
  const [identifying, setIdentifying]   = useState(false);
  const [idSuggestion, setIdSuggestion] = useState(null); // {pest,severity,conf} | {invalid:true} | null
  const idFileRef = useRef();

  function identifyPest(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      setIdPhoto(e.target.result);
      setIdSuggestion(null);
      setIdentifying(true);
      const imgEl = new window.Image();
      imgEl.onload = () => {
        const { greenRatio, brownYellowRatio } = analyzeImagePixels(imgEl);
        setTimeout(() => {
          // Reject photos that don't look like plant/leaf material at all
          if (greenRatio + brownYellowRatio < 0.15) {
            setIdentifying(false);
            setIdSuggestion({ invalid: true });
            return;
          }
          // Bias the guess toward the currently-selected crop's known pests,
          // using damage-tone intensity to pick within that pool and to
          // suggest a severity level — same heuristic style as the Disease
          // Detector, clearly presented as a suggestion to confirm below.
          const pool = CROP_PESTS[form.crop] || PEST_TYPES;
          const bucket = brownYellowRatio > 0.3 ? 2 : brownYellowRatio > 0.12 ? 1 : 0;
          const pest = pool[Math.min(pool.length - 1, bucket)];
          const severity = Math.min(5, Math.max(1, 2 + bucket + (Math.random() > 0.5 ? 1 : 0)));
          const conf = Math.min(0.97, +(0.70 + brownYellowRatio * 0.2 + Math.random() * 0.05).toFixed(2));
          setF('pest', pest);
          setF('severity', String(severity));
          setIdSuggestion({ pest, severity, conf });
          setIdentifying(false);
        }, 1200);
      };
      imgEl.onerror = () => { setIdentifying(false); setIdSuggestion({ invalid: true }); };
      imgEl.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // Count reports per district
  const districtCounts = reports.reduce((acc, r) => {
    acc[r.district] = (acc[r.district] || 0) + 1;
    return acc;
  }, {});

  // Active outbreaks (≥3 reports in same district)
  const outbreaks = Object.entries(districtCounts)
    .filter(([, c]) => c >= 3)
    .sort(([, a], [, b]) => b - a);

  // Most affected pest per district
  const districtPests = reports.reduce((acc, r) => {
    if (!acc[r.district]) acc[r.district] = {};
    acc[r.district][r.pest] = (acc[r.district][r.pest] || 0) + 1;
    return acc;
  }, {});
  function topPest(district) {
    const p = districtPests[district];
    if (!p) return '';
    return Object.entries(p).sort(([,a],[,b])=>b-a)[0][0];
  }

  function setF(k, v) { setForm(f => ({ ...f, [k]: v })); }

  // ── Load Leaflet and render heatmap ──
  useEffect(() => {
    if (viewTab !== 'map') return;
    if (!mapRef.current) return;

    function initMap() {
      if (mapInst.current) return; // already initialised

      const L = window.L;
      const map = L.map(mapRef.current, { zoomControl: true, scrollWheelZoom: false }).setView([16.5, 80.5], 6);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors', maxZoom: 18,
      }).addTo(map);

      mapInst.current  = map;
      markerGrp.current = L.layerGroup().addTo(map);
      updateHeatmap(map);
    }

    function loadHeatPlugin() {
      if (window.L && window.L.heatLayer) { initMap(); return; }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js';
      s.onload = () => initMap();
      document.head.appendChild(s);
    }

    if (window.L) { loadHeatPlugin(); }
    else {
      const css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(css);
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload = () => loadHeatPlugin();
      document.head.appendChild(s);
    }

    // Tear the map down whenever we leave this tab (or the component
    // unmounts) — its <div> gets removed from the DOM by the conditional
    // render above, so the Leaflet instance must be destroyed too, or
    // next time we come back it silently fails to re-attach.
    return () => {
      if (mapInst.current) {
        mapInst.current.remove();
        mapInst.current = null;
        markerGrp.current = null;
        heatInst.current = null;
      }
    };
  }, [viewTab]);

  // Re-draw heatmap when reports change
  useEffect(() => {
    if (mapInst.current) updateHeatmap(mapInst.current);
  }, [reports, filterCrop, filterPest]);

  function updateHeatmap(map) {
    const L = window.L;
    if (!L) return;

    // Filter reports
    let filtered = reports;
    if (filterCrop !== 'All') filtered = filtered.filter(r => r.crop === filterCrop);
    if (filterPest !== 'All') filtered = filtered.filter(r => r.pest === filterPest);

    // Remove old layers
    if (heatInst.current) { map.removeLayer(heatInst.current); heatInst.current = null; }
    if (markerGrp.current) markerGrp.current.clearLayers();

    // Build heatmap data [lat, lng, intensity]
    const heatData = filtered.map(r => {
      const coords = DISTRICT_COORDS[r.district];
      if (!coords) return null;
      const jitter = (Math.random() - 0.5) * 0.3;
      return [coords[0] + jitter, coords[1] + jitter, r.severity / 5];
    }).filter(Boolean);

    if (heatData.length > 0 && L.heatLayer) {
      heatInst.current = L.heatLayer(heatData, {
        radius: 35, blur: 25, maxZoom: 10,
        gradient: { 0.2: '#1D9E75', 0.5: '#EF9F27', 0.8: '#E24B4A', 1.0: '#791F1F' },
      }).addTo(map);
    }

    // Add district markers for outbreaks
    Object.entries(districtCounts).forEach(([dist, count]) => {
      if (count < 3) return;
      const coords = DISTRICT_COORDS[dist];
      if (!coords) return;
      const color = count >= 5 ? '#E24B4A' : '#EF9F27';
      const icon = L.divIcon({
        className: '',
        html: `<div style="background:${color};color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">${count}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14],
      });
      L.marker(coords, { icon })
        .bindPopup(`<b>⚠️ ${dist}</b><br/>${count} reports · Top pest: ${topPest(dist)}`)
        .addTo(markerGrp.current);
    });
  }

  // Submit a new pest report
  function submitReport() {
    const coords = DISTRICT_COORDS[form.district];
    if (!coords) return;
    const jitter = (Math.random() - 0.5) * 0.25;
    const newReport = {
      district: form.district,
      crop: form.crop,
      pest: form.pest,
      severity: parseInt(form.severity),
      lat: coords[0] + jitter,
      lng: coords[1] + jitter,
      isNew: true,
    };
    setReports(prev => [...prev, newReport]);
    setSubmitted(true);
    setIdPhoto(null); setIdSuggestion(null);
    showToast(TE
      ? `✅ ${form.district}లో ${TE ? PEST_TE[form.pest] || form.pest : form.pest} నివేదించబడింది!`
      : `✅ ${form.pest} reported in ${form.district}!`);
    setTimeout(() => { setSubmitted(false); setViewTab('map'); }, 2000);
  }

  const allCrops  = ['All', ...new Set(reports.map(r => r.crop))];
  const allPests  = ['All', ...new Set(reports.map(r => r.pest))];
  const sevColor  = s => s >= 4 ? 'var(--red)' : s >= 3 ? 'var(--amber)' : 'var(--green)';
  const sevBg     = s => s >= 4 ? 'var(--red-l)' : s >= 3 ? 'var(--amber-l)' : 'var(--green-l)';
  const sevLabel  = s => s >= 4 ? (TE ? 'తీవ్రమైన' : 'Severe') : s >= 3 ? (TE ? 'మధ్యస్థ' : 'Moderate') : (TE ? 'తక్కువ' : 'Mild');

  return (
    <div className="page">
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10,marginBottom:'1rem'}}>
        <h2 className="stitle" style={{margin:0}}>🐛 {TE ? 'పురుగుల వ్యాప్తి హీట్‌మ్యాప్' : 'Pest Outbreak Heatmap'}</h2>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:12,fontWeight:600,padding:'4px 12px',borderRadius:99,background:'var(--red-l)',color:'var(--red-d)'}}>
            {outbreaks.length} {TE ? 'చురుకైన వ్యాప్తులు' : 'active outbreaks'}
          </span>
          <span style={{fontSize:12,color:'var(--muted)',padding:'4px 12px',borderRadius:99,background:'var(--bg)'}}>
            {reports.length} {TE ? 'మొత్తం నివేదికలు' : 'total reports'}
          </span>
        </div>
      </div>

      {/* ── FEATURE 2: Outbreak alert banners ── */}
      {outbreaks.length > 0 && (
        <div style={{marginBottom:'1rem'}}>
          {outbreaks.slice(0, 3).map(([dist, count]) => (
            <div key={dist} style={{
              background: count >= 5 ? 'var(--red-l)' : 'var(--amber-l)',
              border: `1.5px solid ${count >= 5 ? 'var(--red)' : 'var(--amber)'}`,
              borderRadius:'var(--rs)', padding:'10px 14px', marginBottom:6,
              display:'flex', alignItems:'center', gap:10, flexWrap:'wrap',
            }}>
              <span style={{fontSize:18}}>{count >= 5 ? '🚨' : '⚠️'}</span>
              <div style={{flex:1}}>
                <span style={{fontSize:13,fontWeight:700,color: count>=5?'var(--red-d)':'var(--amber-d)'}}>
                  {TE ? `${DIST_TE[dist]||dist}లో ${PEST_TE[topPest(dist)]||topPest(dist)} వ్యాప్తి గుర్తించబడింది` : `${topPest(dist)} outbreak detected in ${dist}`}
                </span>
                <span style={{fontSize:12,color:'var(--muted)',marginLeft:8}}>
                  {count} {TE?'నివేదికలు':'reports'} · {TE?'వెంటనే చర్య తీసుకోండి':'Take action now'}
                </span>
              </div>
              <span style={{fontSize:11,fontWeight:600,padding:'3px 10px',borderRadius:99,
                background: count>=5?'var(--red)':'var(--amber)', color:'#fff'}}>
                {count >= 5 ? (TE?'అత్యవసరం':'URGENT') : (TE?'హెచ్చరిక':'WARNING')}
              </span>
            </div>
          ))}
        </div>
      )}

      {/* Tabs */}
      <div className="tabs">
        <div className={`tab${viewTab==='map'?' active':''}`} onClick={()=>setViewTab('map')}>🗺️ {TE?'లైవ్ మ్యాప్':'Live Map'}</div>
        <div className={`tab${viewTab==='report'?' active':''}`} onClick={()=>setViewTab('report')}>📝 {TE?'పురుగు నివేదించు':'Report Pest'}</div>
        <div className={`tab${viewTab==='alerts'?' active':''}`} onClick={()=>setViewTab('alerts')}>🚨 {TE?'వ్యాప్తి జాబితా':'Outbreaks'} ({outbreaks.length})</div>
      </div>

      {/* ── FEATURE 1: Live heatmap ── */}
      {viewTab === 'map' && (
        <div>
          {/* Filters */}
          <div style={{display:'flex',gap:8,marginBottom:'1rem',flexWrap:'wrap',alignItems:'center'}}>
            <span style={{fontSize:12,color:'var(--muted)',fontWeight:500}}>{TE?'ఫిల్టర్:':'Filter:'}</span>
            <select value={filterCrop} onChange={e=>{setFilterCrop(e.target.value);}}
              style={{padding:'5px 10px',borderRadius:99,border:'1px solid var(--border)',fontSize:12,background:'var(--surface)'}}>
              {allCrops.map(c=><option key={c}>{c}</option>)}
            </select>
            <select value={filterPest} onChange={e=>{setFilterPest(e.target.value);}}
              style={{padding:'5px 10px',borderRadius:99,border:'1px solid var(--border)',fontSize:12,background:'var(--surface)'}}>
              {allPests.map(p=><option key={p}>{p}</option>)}
            </select>
            <button className="btn btn-o" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>{setFilterCrop('All');setFilterPest('All');}}>
              ✕ {TE?'క్లియర్':'Clear'}
            </button>
          </div>

          {/* Heatmap legend */}
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:8,fontSize:11,color:'var(--muted)',flexWrap:'wrap'}}>
            <span style={{fontWeight:600}}>{TE?'తీవ్రత:':'Intensity:'}</span>
            {[['#1D9E75',TE?'తక్కువ':'Low'],['#EF9F27',TE?'మధ్యస్థ':'Medium'],['#E24B4A',TE?'అధికం':'High'],['#791F1F',TE?'అత్యధికం':'Critical']].map(([c,l])=>(
              <span key={l} style={{display:'flex',alignItems:'center',gap:4}}>
                <span style={{width:12,height:12,borderRadius:'50%',background:c,display:'inline-block'}}></span>{l}
              </span>
            ))}
            <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:4}}>
              <span style={{width:20,height:20,borderRadius:'50%',background:'#EF9F27',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,color:'#fff'}}>3+</span>
              {TE?'వ్యాప్తి జిల్లా':'Outbreak district'}
            </span>
          </div>

          {/* MAP CONTAINER */}
          <div style={{borderRadius:'var(--r)',overflow:'hidden',border:'1px solid var(--border)',marginBottom:'1rem'}}>
            <div ref={mapRef} style={{height:420,width:'100%',background:'#e8f4e8'}}></div>
          </div>

          {/* Stats row */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:'1rem'}}>
            {[
              {l:TE?'మొత్తం నివేదికలు':'Total Reports',v:reports.length,c:'var(--blue)'},
              {l:TE?'వ్యాప్తి జిల్లాలు':'Outbreak Districts',v:outbreaks.length,c:'var(--red)'},
              {l:TE?'అత్యంత ప్రభావిత పంట':'Most Affected Crop',v:[...reports.reduce((m,r)=>{m.set(r.crop,(m.get(r.crop)||0)+1);return m;},new Map())].sort((a,b)=>b[1]-a[1])[0]?.[0]||'-',c:'var(--amber)'},
              {l:TE?'అత్యంత సాధారణ పురుగు':'Most Common Pest',v:[...reports.reduce((m,r)=>{m.set(r.pest,(m.get(r.pest)||0)+1);return m;},new Map())].sort((a,b)=>b[1]-a[1])[0]?.[0]||'-',c:'var(--green)'},
            ].map(s=>(
              <div key={s.l} style={{background:'var(--bg)',borderRadius:'var(--rs)',padding:'8px 10px',textAlign:'center'}}>
                <div style={{fontSize:10,color:'var(--muted)',marginBottom:3,lineHeight:1.3}}>{s.l}</div>
                <div style={{fontSize:typeof s.v==='number'?20:13,fontWeight:600,color:s.c,lineHeight:1.2}}>{s.v}</div>
              </div>
            ))}
          </div>

          {/* Recent reports list */}
          <div className="card">
            <div className="card-title">{TE?'తాజా నివేదికలు':'Recent Reports'}</div>
            {reports.slice(-6).reverse().map((r, i) => (
              <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:sevColor(r.severity),minWidth:8}}/>
                <div style={{flex:1}}>
                  <span style={{fontSize:13,fontWeight:500}}>{TE?(PEST_TE[r.pest]||r.pest):r.pest}</span>
                  <span style={{fontSize:12,color:'var(--muted)',marginLeft:6}}>on {r.crop}</span>
                </div>
                <span style={{fontSize:11,color:'var(--muted)'}}>{TE?(DIST_TE[r.district]||r.district):r.district}</span>
                <span style={{fontSize:10,fontWeight:600,padding:'2px 7px',borderRadius:99,background:sevBg(r.severity),color:sevColor(r.severity)}}>
                  {sevLabel(r.severity)}
                </span>
                {r.isNew && <span style={{fontSize:10,fontWeight:600,padding:'2px 7px',borderRadius:99,background:'var(--green-l)',color:'var(--green-d)'}}>NEW</span>}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── FEATURE 1: Report form ── */}
      {viewTab === 'report' && (
        <div>
          {submitted ? (
            <div style={{textAlign:'center',padding:'4rem 1rem'}}>
              <div style={{fontSize:56,marginBottom:'1rem'}}>✅</div>
              <div style={{fontSize:18,fontWeight:600,color:'var(--green-d)',marginBottom:6}}>
                {TE?'నివేదిక విజయవంతంగా సమర్పించబడింది!':'Report submitted successfully!'}
              </div>
              <div style={{fontSize:13,color:'var(--muted)'}}>{TE?'మ్యాప్ నవీకరించబడుతోంది...':'Updating the heatmap...'}</div>
            </div>
          ) : (
            <div className="two">
              <div>
                <div className="card">

// AI CROP MONITORING — new feature (additive only, does not touch any
// existing component, state, or data). Uses on-device image analysis
// (same canvas-pixel technique as analyzeImagePixels) to estimate crop
// health, vegetation index, growth stage progress, and stress alerts.
// ══════════════════════════════════════════
function saveMonH(d){
  const h=JSON.parse(localStorage.getItem('kd_mon_h')||'[]');
  h.unshift({...d,id:Date.now(),date:new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})});
  localStorage.setItem('kd_mon_h',JSON.stringify(h.slice(0,30)));
}
function getMonH(){ return JSON.parse(localStorage.getItem('kd_mon_h')||'[]'); }

const MONITOR_CROPS=['Rice','Chilli','Cotton','Groundnut','Maize','Tomato','Sugarcane'];
const GROWTH_STAGES_EN=['Sowing','Vegetative','Flowering','Fruiting','Maturity'];
const GROWTH_STAGES_TE=['విత్తనం','వృద్ధి','పుష్పించడం','ఫలదీకరణ','పక్వత'];

function CropMonitoring({lang,showToast}){
  const TE=lang==='TE';
  const [imgSrc,setImgSrc]=useState(null);
  const [imgFile,setImgFile]=useState(null);
  const [drag,setDrag]=useState(false);
  const [loading,setLoading]=useState(false);
  const [amsg,setAmsg]=useState('');
  const [result,setResult]=useState(null);
  const [selCrop,setSelCrop]=useState('Rice');
  const [stageIdx,setStageIdx]=useState(1);
  const [history,setHistory]=useState(getMonH);
  const fileRef=useRef();

  function handleFile(f){
    if(!f||!f.type.startsWith('image/'))return;
    setImgFile(f);
    const r=new FileReader();r.onload=e=>setImgSrc(e.target.result);r.readAsDataURL(f);
    setResult(null);
  }
  function onDrop(e){ e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }

  async function analyzeField(){
    if(!imgFile)return;
    setLoading(true); setResult(null);
    const msgs=TE
      ?['ఉపగ్రహ చిత్రం విశ్లేషిస్తున్నది...','వృక్ష సూచికను లెక్కిస్తున్నది...','నేల తేమను అంచనా వేస్తున్నది...','ఆరోగ్య నివేదిక సిద్ధమవుతున్నది...']
      :['Scanning field imagery...','Calculating vegetation index...','Estimating soil moisture...','Preparing health report...'];
    let i=0; const iv=setInterval(()=>{ setAmsg(msgs[i%msgs.length]); i++; },650);

    const imgEl=new window.Image();
    imgEl.src=imgSrc;
    await new Promise(res=>{ imgEl.onload=res; imgEl.onerror=res; });
    await new Promise(res=>setTimeout(res,2000));
    const {greenRatio,brownYellowRatio}=analyzeImagePixels(imgEl);
    clearInterval(iv);

    if(greenRatio+brownYellowRatio<0.15){
      setLoading(false);
      showToast(TE
        ? '⚠️ ఇది పంట పొలం చిత్రంలా కనిపించడం లేదు. దయచేసి పొలం/పంట ఫోటోను అప్‌లోడ్ చేయండి.'
        : "⚠️ This doesn't look like a crop/field photo. Please upload a field or crop canopy image.");
      return;
    }

    const healthScore=Math.round(Math.min(100,Math.max(8,(greenRatio*100*1.15)-(brownYellowRatio*60))));
    const ndvi=+(Math.min(0.92,Math.max(0.05,greenRatio*0.9-brownYellowRatio*0.3))).toFixed(2);
    const moisture=Math.round(Math.min(95,Math.max(15,55+greenRatio*40-brownYellowRatio*70+(Math.random()*8-4))));
    const stressLevel = healthScore>=70?'green' : healthScore>=45?'orange' : 'red';

    const alerts=[];
    if(brownYellowRatio>0.25) alerts.push({sev:'danger',icon:'🥵',en:'Significant crop stress detected — leaf discoloration suggests nutrient deficiency or water shortage.',te:'గణనీయమైన పంట ఒత్తిడి గుర్తించబడింది — ఆకు రంగు మార్పు పోషకాహార లోపం లేదా నీటి కొరతను సూచిస్తుంది.'});
    else if(brownYellowRatio>0.12) alerts.push({sev:'warn',icon:'⚠️',te:'కొన్ని ప్రాంతాల్లో ఒత్తిడి సంకేతాలు కనిపిస్తున్నాయి. నిశితంగా పరిశీలించండి.',en:'Mild stress signs in parts of the field — keep a close watch over the next few days.'});
    if(moisture<35) alerts.push({sev:'warn',icon:'💧',en:'Soil moisture looks low — consider irrigating within 1–2 days.',te:'నేల తేమ తక్కువగా ఉంది — 1–2 రోజుల్లో నీటిపారుదల చేయండి.'});
    if(moisture>80) alerts.push({sev:'warn',icon:'🌊',en:'Soil moisture is quite high — ensure proper field drainage to avoid root rot.',te:'నేల తేమ ఎక్కువగా ఉంది — వేరు కుళ్ళు రాకుండా సరైన నీటి పారుదల చూసుకోండి.'});
    if(!alerts.length) alerts.push({sev:'ok',icon:'✅',en:'Crop canopy looks healthy with no major stress signs detected.',te:'పంట ఆరోగ్యంగా కనిపిస్తోంది, పెద్ద ఒత్తిడి సంకేతాలు కనిపించలేదు.'});

    const rec = stressLevel==='red'
      ? {en:'Apply a balanced NPK foliar spray and irrigate promptly. Re-scan in 3 days to confirm recovery.',te:'సమతుల్య NPK ఫోలియర్ స్ప్రే వేసి వెంటనే నీరు పెట్టండి. కోలుకున్నదో లేదో నిర్ధారించడానికి 3 రోజుల్లో మళ్ళీ స్కాన్ చేయండి.'}
      : stressLevel==='orange'
      ? {en:'Monitor closely, ensure adequate irrigation, and consider a light micronutrient spray.',te:'నిశితంగా పరిశీలించండి, తగినంత నీటిపారుదల చూసుకోండి, తేలికపాటి సూక్ష్మపోషక స్ప్రే పరిశీలించండి.'}
      : {en:'Maintain current irrigation and fertilizer schedule. Field conditions are optimal.',te:'ప్రస్తుత నీటిపారుదల మరియు ఎరువుల షెడ్యూల్‌ను కొనసాగించండి. పొలం పరిస్థితులు అనుకూలంగా ఉన్నాయి.'};

    const full={crop:selCrop,stageIdx,healthScore,ndvi,moisture,stressLevel,alerts,rec};
    setResult(full);
    saveMonH(full);
    setHistory(getMonH());
    setLoading(false);
  }

  function reset(){ setImgSrc(null); setImgFile(null); setResult(null); }

  const gaugeColor = !result?'var(--border)':result.stressLevel==='red'?'var(--red)':result.stressLevel==='orange'?'var(--amber)':'var(--green)';
  const trendData = history.slice(0,10).reverse().map(h=>h.healthScore);

  return(
    <div className="page">
      <h2 style={{marginBottom:4}}>🛰️ {TE?'AI పంట పర్యవేక్షణ':'AI Crop Monitoring'}</h2>
      <p style={{color:'var(--muted)',fontSize:13,marginBottom:'1.25rem'}}>
        {TE?'పొలం ఫోటో అప్‌లోడ్ చేసి పంట ఆరోగ్యం, వృక్ష సూచిక మరియు నేల తేమను AI ద్వారా తనిఖీ చేయండి.'
           :'Upload a field / canopy photo and let AI estimate crop health, vegetation index, and soil moisture — no sensors required.'}
      </p>

      <div className="card">
        <div className="card-title">{TE?'పంట & దశ ఎంచుకోండి':'Select Crop & Growth Stage'}</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
          {MONITOR_CROPS.map(c=>(
            <button key={c} className={`mon-crop-chip${selCrop===c?' active':''}`} onClick={()=>setSelCrop(c)}>{c}</button>
          ))}
        </div>
        <div className="mon-stage-track">
          {GROWTH_STAGES_EN.map((s,i)=>(
            <div key={s} className={`mon-stage-seg${i<stageIdx?' done':i===stageIdx?' active':''}`}
                 onClick={()=>setStageIdx(i)} style={{cursor:'pointer'}} title={TE?GROWTH_STAGES_TE[i]:s}/>
          ))}
        </div>
        <div className="mon-stage-labels">
          {(TE?GROWTH_STAGES_TE:GROWTH_STAGES_EN).map(s=><span key={s}>{s}</span>)}
        </div>
      </div>

      <div className="card">
        <div className="card-title">{TE?'పొలం ఫోటో అప్‌లోడ్':'Upload Field Photo'}</div>
        {!imgSrc?(
          <div className={`upzone${drag?' drag':''}`}
               onDragOver={e=>{e.preventDefault();setDrag(true);}}
               onDragLeave={()=>setDrag(false)}
               onDrop={onDrop}
               onClick={()=>fileRef.current&&fileRef.current.click()}>
            <div style={{fontSize:40,marginBottom:8}}>📷</div>
            <div style={{fontWeight:600,marginBottom:4}}>{TE?'ఫోటోను ఇక్కడ వదలండి లేదా క్లిక్ చేయండి':'Drop a field photo here or click to browse'}</div>
            <div style={{fontSize:12,color:'var(--muted)'}}>{TE?'పంట కేనోపీ / పొలం ఫోటో':'Crop canopy or field-level photo works best'}</div>
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>
        ):(
          <div>
            <img src={imgSrc} alt="field" style={{width:'100%',maxHeight:320,objectFit:'cover',borderRadius:'var(--rs)',marginBottom:12}}/>
            {!result&&!loading&&(
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-p" onClick={analyzeField}>🛰️ {TE?'పంటను విశ్లేషించండి':'Analyze Field'}</button>
                <button className="btn btn-o" onClick={reset}>🔄 {TE?'మరొక ఫోటో':'Try Another'}</button>
              </div>
            )}
            {loading&&(
              <div>
                <div className="astep"><span style={{color:'var(--green)'}}>●</span>{amsg}</div>
              </div>
            )}
          </div>
        )}
      </div>

      {result&&!loading&&(
        <>
          <div className="card">
            <div className="card-title">{TE?'పంట ఆరోగ్య స్కోర్':'Crop Health Score'}</div>
            <div className="mon-gauge-wrap">
              <div className="mon-gauge" style={{background:`conic-gradient(${gaugeColor} ${result.healthScore*3.6}deg, var(--bg) 0deg)`}}>
                <div className="mon-gauge-inner">
                  <div className="mon-gauge-score" style={{color:gaugeColor}}>{result.healthScore}</div>
                  <div className="mon-gauge-label">{TE?'ఆరోగ్య స్కోర్':'Health Score'}</div>
                </div>
              </div>
              <div style={{flex:1,minWidth:180}}>
                <span className={`sbadge s-${result.stressLevel}`}>
                  {result.stressLevel==='red'?(TE?'అధిక ఒత్తిడి':'High Stress'):result.stressLevel==='orange'?(TE?'మధ్యస్థ ఒత్తిడి':'Moderate Stress'):(TE?'ఆరోగ్యకరం':'Healthy')}
                </span>
                <div className="mon-grid" style={{marginTop:12}}>
                  <div className="mon-metric">
                    <div className="mon-metric-icon">🌿</div>
                    <div className="mon-metric-val">{result.ndvi}</div>
                    <div className="mon-metric-label">{TE?'వృక్ష సూచిక (NDVI)':'Vegetation Index (NDVI)'}</div>
                  </div>
                  <div className="mon-metric">
                    <div className="mon-metric-icon">💧</div>
                    <div className="mon-metric-val">{result.moisture}%</div>
                    <div className="mon-metric-label">{TE?'నేల తేమ':'Soil Moisture'}</div>
                  </div>
                  <div className="mon-metric">
                    <div className="mon-metric-icon">🌾</div>
                    <div className="mon-metric-val" style={{fontSize:15}}>{TE?GROWTH_STAGES_TE[result.stageIdx]:GROWTH_STAGES_EN[result.stageIdx]}</div>
                    <div className="mon-metric-label">{TE?'పెరుగుదల దశ':'Growth Stage'}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-title">⚠️ {TE?'హెచ్చరికలు & సూచనలు':'Alerts & Recommendations'}</div>
            {result.alerts.map((a,i)=>(
              <div key={i} className={`mon-alert ${a.sev}`}>
                <span className="mon-alert-icon">{a.icon}</span>
                <span className={TE?'':''}>{TE?a.te:a.en}</span>
              </div>
            ))}
            <div className="tsec" style={{padding:'12px 0 0',borderTop:'none'}}>
              <div className="tlabel">💡 {TE?'సిఫార్సు చర్య':'Recommended Action'}</div>
              <div className="ttext">{TE?result.rec.te:result.rec.en}</div>
            </div>
          </div>

          {trendData.length>1&&(
            <div className="card">
              <div className="card-title">📈 {TE?'ఆరోగ్య ధోరణి (గత స్కాన్‌లు)':'Health Trend (Recent Scans)'}</div>
              <div className="mon-trend-box">
                <Spark data={trendData} color="#1D9E75"/>
              </div>
            </div>
          )}
        </>
      )}

      {history.length>0&&(
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
            <div className="card-title" style={{margin:0}}>{TE?'స్కాన్ చరిత్ర':'Scan History'}</div>
            <button className="hf" style={{borderColor:'var(--red-l)',color:'var(--red)'}}
              onClick={()=>{localStorage.removeItem('kd_mon_h');setHistory([]);}}>🗑 {TE?'తొలగించు':'Clear'}</button>
          </div>
          <div className="hlist">
            {history.slice(0,8).map(h=>(
              <div key={h.id} className="hitem">
                <div className="hdot" style={{background:h.stressLevel==='red'?'#E24B4A':h.stressLevel==='orange'?'#EF9F27':'#1D9E75'}}/>
                <div className="hinfo">
                  <div className="hname">{h.crop} — {GROWTH_STAGES_EN[h.stageIdx]}</div>
                  <div className="hmeta">{h.date} · NDVI {h.ndvi} · {TE?'తేమ':'Moisture'} {h.moisture}%</div>
                </div>
                <div className="hright">
                  <div className="hconf" style={{color:h.stressLevel==='red'?'#E24B4A':h.stressLevel==='orange'?'#EF9F27':'#1D9E75'}}>{h.healthScore}</div>
                  <div className="hsev" style={{background:h.stressLevel==='red'?'#FCEBEB':h.stressLevel==='orange'?'#FAEEDA':'#E1F5EE',color:h.stressLevel==='red'?'#791F1F':h.stressLevel==='orange'?'#633806':'#085041'}}>
                    {h.stressLevel==='red'?(TE?'అధిక ఒత్తిడి':'High'):h.stressLevel==='orange'?(TE?'మధ్యస్థ':'Moderate'):(TE?'ఆరోగ్యం':'Healthy')}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════
// HARVEST PREDICTION — new feature (additive only, does not touch any
// existing component, state, or data). Estimates harvest-readiness date,
// growth-stage progress, expected yield & market value, reusing the
// same CROP_DB / CROP_PRICE_DB / WEATHER_DATA / DIST_AP / DIST_TS data
// already used elsewhere in the app.
// ══════════════════════════════════════════
function saveHvH(d){
  const h=JSON.parse(localStorage.getItem('kd_harvest_h')||'[]');
  h.unshift({...d,id:Date.now(),savedAt:new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})});
  localStorage.setItem('kd_harvest_h',JSON.stringify(h.slice(0,30)));
}
function getHvH(){ return JSON.parse(localStorage.getItem('kd_harvest_h')||'[]'); }

// Typical sowing-to-harvest duration, in days, per crop
const HARVEST_DURATION_DAYS = {
  Rice:120, Chilli:150, Groundnut:100, Cotton:165, Onion:110, Maize:100, Sunflower:90, Sugarcane:365
};

function fmtDate(d){ return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function addDaysTo(dateStr,n){ const d=new Date(dateStr); d.setDate(d.getDate()+n); return d; }

function HarvestPrediction({lang,showToast}){
  const TE=lang==='TE';
  const todayISO=new Date().toISOString().slice(0,10);
  const defaultSowing=(()=>{ const d=new Date(); d.setDate(d.getDate()-45); return d.toISOString().slice(0,10); })();

  const [selCrop,setSelCrop]=useState('Rice');
  const [district,setDistrict]=useState('');
  const [sowingDate,setSowingDate]=useState(defaultSowing);
  const [landSize,setLandSize]=useState('2');
  const [loading,setLoading]=useState(false);
  const [amsg,setAmsg]=useState('');
  const [result,setResult]=useState(null);
  const [history,setHistory]=useState(getHvH);

  async function predict(){
    if(!sowingDate){ showToast(TE?'దయచేసి విత్తిన తేదీ ఎంచుకోండి':'Please select a sowing date'); return; }
    setLoading(true); setResult(null);
    const msgs=TE
      ?['పంట క్యాలెండర్ లెక్కిస్తున్నది...','వాతావరణ డేటాను పరిశీలిస్తున్నది...','దిగుబడిని అంచనా వేస్తున్నది...','నివేదిక సిద్ధమవుతున్నది...']
      :['Reading crop calendar...','Cross-checking weather signals...','Estimating yield...','Finalizing prediction...'];
    let i=0; const iv=setInterval(()=>{ setAmsg(msgs[i%msgs.length]); i++; },550);
    await new Promise(res=>setTimeout(res,1800));
    clearInterval(iv);

    const duration = HARVEST_DURATION_DAYS[selCrop] || 110;
    const wx = WEATHER_DATA[district];
    let weatherAdjust = 0;
    let weatherNote = null;
    if (wx){
      if (wx.rain >= 55){ weatherAdjust = 4; weatherNote = {sev:'warn',en:`Heavy rain forecast in ${district} may delay maturity by a few days — plan harvest logistics with buffer time.`,te:`${district}లో భారీ వర్షం అంచనా — పంట పక్వతలో కొంత ఆలస్యం కావచ్చు, తగినంత సమయం ఉంచుకోండి.`}; }
      else if (wx.rain <= 10 && wx.temp >= 36){ weatherAdjust = -2; weatherNote = {sev:'ok',en:`Hot, dry conditions in ${district} may slightly speed up maturity — monitor moisture closely.`,te:`${district}లో వేడి, పొడి వాతావరణం పక్వతను కొంచెం వేగవంతం చేయవచ్చు — తేమను నిశితంగా గమనించండి.`}; }
      else { weatherNote = {sev:'ok',en:`Weather in ${district} looks favorable for normal crop development.`,te:`${district}లో వాతావరణం సాధారణ పంట అభివృద్ధికి అనుకూలంగా ఉంది.`}; }
    }

    const sowing = new Date(sowingDate);
    const today = new Date();
    const daysElapsed = Math.max(0, Math.round((today-sowing)/86400000));
    const effectiveDuration = duration + weatherAdjust;
    const harvestDate = addDaysTo(sowingDate, effectiveDuration);
    const daysRemaining = Math.round((harvestDate-today)/86400000);
    const progressPct = Math.min(100, Math.max(0, Math.round((daysElapsed/effectiveDuration)*100)));

    let stageName_en, stageName_te;
    if (progressPct>=100){ stageName_en='Ready to Harvest'; stageName_te='కోతకు సిద్ధం'; }
    else if (progressPct>=85){ stageName_en='Maturity'; stageName_te='పక్వత'; }
    else if (progressPct>=60){ stageName_en='Fruiting'; stageName_te='ఫలదీకరణ'; }
    else if (progressPct>=35){ stageName_en='Flowering'; stageName_te='పుష్పించడం'; }
    else if (progressPct>=10){ stageName_en='Vegetative'; stageName_te='వృద్ధి'; }
    else { stageName_en='Sowing'; stageName_te='విత్తనం'; }

    const acres = parseFloat(landSize)||1;
    const yieldPerAcre = CROP_PRICE_DB[selCrop]?.yieldPerAcre || CROP_DB[selCrop]?.avgYield || 20;
    const priceNow = CROP_PRICE_DB[selCrop]?.current || 2000;
    const variance = 0.9 + Math.sin((daysElapsed+selCrop.length)*0.7)*0.05 + 0.05;
    const expectedYieldQtl = Math.round(yieldPerAcre*acres*variance);
    const estRevenue = Math.round(expectedYieldQtl*priceNow);
    const confidence = Math.min(96, 74 + (district?10:0) + Math.round(Math.random()*8));

    const tips_en = progressPct>=100
      ? 'Harvest window is open — schedule labour/machinery soon and check mandi prices before selling.'
      : daysRemaining<=7
      ? 'Harvest is approaching — arrange storage, labour and transport in advance.'
      : 'Continue routine irrigation and pest monitoring until closer to the harvest window.';
    const tips_te = progressPct>=100
      ? 'కోత సమయం వచ్చింది — త్వరలో కూలీలు/యంత్రాలు సిద్ధం చేసుకోండి, అమ్మే ముందు మండీ ధరలు చూసుకోండి.'
      : daysRemaining<=7
      ? 'కోత సమీపిస్తోంది — నిల్వ, కూలీలు మరియు రవాణాను ముందుగానే ఏర్పాటు చేసుకోండి.'
      : 'కోత సమయం దగ్గరయ్యే వరకు సాధారణ నీటిపారుదల మరియు పురుగు పరిశీలన కొనసాగించండి.';

    const full={crop:selCrop,district,sowingDate,duration:effectiveDuration,harvestDate:harvestDate.getTime(),
      daysElapsed,daysRemaining,progressPct,stageName_en,stageName_te,expectedYieldQtl,estRevenue,confidence,
      weatherNote,tips_en,tips_te,landSize:acres};
    setResult(full);
    saveHvH(full);
    setHistory(getHvH());
    setLoading(false);
  }

  return(
    <div className="page">
      <h2 style={{marginBottom:4}}>🌾 {TE?'పంట కోత అంచనా':'Harvest Prediction'}</h2>
      <p style={{color:'var(--muted)',fontSize:13,marginBottom:'1.25rem'}}>
        {TE?'పంట, జిల్లా, విత్తిన తేదీ ఇచ్చి కోత తేదీ, దిగుబడి మరియు మార్కెట్ విలువను అంచనా వేయండి.'
           :'Enter your crop, district and sowing date to predict the harvest date, expected yield and market value.'}
      </p>

      <div className="card">
        <div className="card-title">{TE?'వివరాలు నమోదు చేయండి':'Enter Field Details'}</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
          {Object.keys(HARVEST_DURATION_DAYS).map(c=>(
            <button key={c} className={`mon-crop-chip${selCrop===c?' active':''}`} onClick={()=>setSelCrop(c)}>
              {CROP_DB[c]?.emoji} {c}
            </button>
          ))}
        </div>
        <div className="tgrid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))'}}>
          <div>
            <div className="titem-label" style={{marginBottom:5}}>📍 {TE?'జిల్లా (ఐచ్ఛికం)':'District (optional)'}</div>

          <div className="card">
            <div className="tsec" style={{padding:0,borderTop:'none'}}>

            <div className="card-title" style={{margin:0}}>{TE?'గత అంచనాలు':'Past Predictions'}</div>

          </div>
          <div className="hlist">
            {history.slice(0,8).map(h=>(
              <div key={h.id} className="hitem">
                <div className="hdot" style={{background:h.progressPct>=100?'#1D9E75':'#EF9F27'}}/>
                <div className="hinfo">
                  <div className="hname">{CROP_DB[h.crop]?.emoji} {h.crop}{h.district?` · ${h.district}`:''}</div>
                  <div className="hmeta">{TE?'కోత:':'Harvest:'} {fmtDate(new Date(h.harvestDate))} · {h.expectedYieldQtl} {TE?'క్వి.':'qtl'}</div>
                </div>
                <div className="hright">
                  <div className="hconf" style={{color:'#1D9E75'}}>{h.progressPct}%</div>
                  <div className="hsev" style={{background:'#E1F5EE',color:'#085041'}}>
                    {h.progressPct>=100?(TE?'సిద్ధం':'Ready'):(TE?h.stageName_te:h.stageName_en)}
                  </div>

            ))}

    </div>
  );

// QUALITY GRADING — new feature (additive only, does not touch any
// existing component, state, or data). Uses the same on-device canvas
// pixel-analysis technique as analyzeImagePixels (Disease Detector) plus
// a new lightweight uniformity check to grade harvested produce and
// estimate a price premium/discount vs today's mandi price.
// ══════════════════════════════════════════
function saveQgH(d){
  const h=JSON.parse(localStorage.getItem('kd_quality_h')||'[]');
  h.unshift({...d,id:Date.now(),date:new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})});
  localStorage.setItem('kd_quality_h',JSON.stringify(h.slice(0,30)));
}
function getQgH(){ return JSON.parse(localStorage.getItem('kd_quality_h')||'[]'); }

// Samples a coarse grid of average-brightness cells and returns a 0–1
// uniformity score (1 = very even colour/size across the batch, lower =
// more mixed sizes/colours — a common visual cue graders look for).
function analyzeUniformity(imgEl){
  const canvas=document.createElement('canvas');
  const w=canvas.width=60,h=canvas.height=60;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(imgEl,0,0,w,h);
  const data=ctx.getImageData(0,0,w,h).data;
  const cells=6, cellW=w/cells, cellH=h/cells;
  const means=[];
  for(let cy=0;cy<cells;cy++){
    for(let cx=0;cx<cells;cx++){
      let sum=0,count=0;
      for(let y=cy*cellH;y<(cy+1)*cellH;y++){
        for(let x=cx*cellW;x<(cx+1)*cellW;x++){
          const i=(Math.floor(y)*w+Math.floor(x))*4;
          sum += (data[i]+data[i+1]+data[i+2])/3;
          count++;
        }
      }
      means.push(sum/(count||1));
    }
  }
  const avg=means.reduce((a,b)=>a+b,0)/means.length;
  const variance=means.reduce((a,b)=>a+(b-avg)*(b-avg),0)/means.length;
  const stdDev=Math.sqrt(variance);
  const coeffVar=avg>0?stdDev/avg:0;
  return Math.max(0,Math.min(1,1-coeffVar*1.8));
}

const QUALITY_GRADE_CROPS=['Rice','Chilli','Groundnut','Cotton','Onion','Maize','Sunflower','Sugarcane'];

function QualityGrading({lang,showToast}){
  const TE=lang==='TE';
  const [imgSrc,setImgSrc]=useState(null);
  const [imgFile,setImgFile]=useState(null);
  const [drag,setDrag]=useState(false);
  const [loading,setLoading]=useState(false);
  const [amsg,setAmsg]=useState('');
  const [result,setResult]=useState(null);
  const [selCrop,setSelCrop]=useState('Rice');
  const [history,setHistory]=useState(getQgH);
  const fileRef=useRef();

  function handleFile(f){
    if(!f||!f.type.startsWith('image/'))return;
    setImgFile(f);
    const r=new FileReader();r.onload=e=>setImgSrc(e.target.result);r.readAsDataURL(f);
    setResult(null);
  }
  function onDrop(e){ e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }

  async function analyzeQuality(){
    if(!imgFile)return;
    setLoading(true); setResult(null);
    const msgs=TE
      ?['చిత్రం లోడ్ అవుతున్నది...','రంగు & పరిమాణం పరిశీలిస్తున్నది...','లోపాలను గుర్తిస్తున్నది...','గ్రేడ్ నిర్ధారిస్తున్నది...']
      :['Loading image...','Checking colour & size...','Scanning for blemishes...','Assigning quality grade...'];
    let i=0; const iv=setInterval(()=>{ setAmsg(msgs[i%msgs.length]); i++; },600);

    const imgEl=new window.Image();
    imgEl.src=imgSrc;
    await new Promise(res=>{ imgEl.onload=res; imgEl.onerror=res; });
    await new Promise(res=>setTimeout(res,2000));
    const {greenRatio,brownYellowRatio}=analyzeImagePixels(imgEl);
    const uniformity=analyzeUniformity(imgEl);
    clearInterval(iv);

    if(greenRatio+brownYellowRatio<0.12){
      setLoading(false);
      showToast(TE
        ? '⚠️ ఇది పంట/ఉత్పత్తి చిత్రంలా కనిపించడం లేదు. దయచేసి పంట దిగుబడి ఫోటోను అప్‌లోడ్ చేయండి.'
        : "⚠️ This doesn't look like a produce/harvest photo. Please upload a photo of your harvested crop batch.");
      return;
    }

    const freshness = Math.round(Math.min(100,Math.max(15, 100 - brownYellowRatio*140 + greenRatio*15)));
    const defectLevel = Math.round(Math.min(100,Math.max(0, brownYellowRatio*175)));
    const uniformityPct = Math.round(uniformity*100);
    const sheen = Math.round(Math.min(100,Math.max(10, 45 + greenRatio*45 - brownYellowRatio*45)));

    const qualityScore = Math.round(Math.min(100,Math.max(5,
      (100-defectLevel)*0.40 + uniformityPct*0.35 + freshness*0.25)));

    let grade, gradeColor, gradeLabelEn, gradeLabelTe, priceMult;
    if (qualityScore>=85){ grade='A+'; gradeColor='var(--green)'; gradeLabelEn='Premium / Export Grade'; gradeLabelTe='ప్రీమియం / ఎగుమతి గ్రేడ్'; priceMult=1.15; }
    else if (qualityScore>=70){ grade='A'; gradeColor='var(--green)'; gradeLabelEn='Grade A'; gradeLabelTe='గ్రేడ్ A'; priceMult=1.05; }
    else if (qualityScore>=50){ grade='B'; gradeColor='var(--amber)'; gradeLabelEn='Grade B'; gradeLabelTe='గ్రేడ్ B'; priceMult=1.0; }
    else { grade='C'; gradeColor='var(--red)'; gradeLabelEn='Grade C'; gradeLabelTe='గ్రేడ్ C'; priceMult=0.85; }

    const basePrice = CROP_PRICE_DB[selCrop]?.current || 2000;
    const estPricePerQtl = Math.round(basePrice*priceMult);
    const priceDeltaPct = Math.round((priceMult-1)*100);

    const alerts=[];
    if (defectLevel>45) alerts.push({sev:'danger',icon:'🔍',en:'High blemish/defect level detected — sort out damaged pieces before sale to lift your average grade.',te:'అధిక లోపాలు గుర్తించబడ్డాయి — అమ్మకానికి ముందు దెబ్బతిన్న వాటిని వేరు చేయండి, గ్రేడ్ మెరుగవుతుంది.'});
    if (uniformityPct<50) alerts.push({sev:'warn',icon:'📏',en:'Batch shows mixed sizes/colours — grading and sorting before market can raise your realised price.',te:'బ్యాచ్‌లో పరిమాణాలు/రంగులు కలగలిపి ఉన్నాయి — మార్కెట్‌కు ముందు గ్రేడింగ్ చేస్తే ధర పెరుగుతుంది.'});
    if (grade==='A+') alerts.push({sev:'ok',icon:'🏆',en:'Excellent batch — eligible for premium buyers, export aggregators, and quality-based bonuses.',te:'అద్భుతమైన బ్యాచ్ — ప్రీమియం కొనుగోలుదారులు, ఎగుమతి సంస్థలకు అర్హత ఉంది.'});
    if (!alerts.length) alerts.push({sev:'ok',icon:'✅',en:'Good overall quality — a light sort for size/colour could push this into the next grade.',te:'మొత్తం మీద మంచి నాణ్యత — పరిమాణం/రంగు ప్రకారం కొద్దిగా వేరు చేస్తే తదుపరి గ్రేడ్‌కు చేరవచ్చు.'});

    const full={crop:selCrop,grade,gradeLabelEn,gradeLabelTe,qualityScore,freshness,defectLevel,uniformityPct,sheen,
      estPricePerQtl,priceDeltaPct,alerts};
    setResult(full);
    saveQgH(full);
    setHistory(getQgH());
    setLoading(false);
  }

  function reset(){ setImgSrc(null); setImgFile(null); setResult(null); }

  return(
    <div className="page">
      <h2 style={{marginBottom:4}}>🏅 {TE?'నాణ్యత గ్రేడింగ్':'Quality Grading'}</h2>
      <p style={{color:'var(--muted)',fontSize:13,marginBottom:'1.25rem'}}>
        {TE?'కోసిన పంట ఫోటో అప్‌లోడ్ చేసి నాణ్యత గ్రేడ్ మరియు మార్కెట్ ధర ప్రభావాన్ని AI ద్వారా తెలుసుకోండి.'
           :'Upload a photo of your harvested batch and let AI grade its quality and estimate the price impact — no lab testing needed.'}
      </p>

      <div className="card">
        <div className="card-title">{TE?'పంటను ఎంచుకోండి':'Select Crop'}</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {QUALITY_GRADE_CROPS.map(c=>(
            <button key={c} className={`mon-crop-chip${selCrop===c?' active':''}`} onClick={()=>setSelCrop(c)}>
              {CROP_DB[c]?.emoji} {c}
            </button>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="card-title">{TE?'ఉత్పత్తి ఫోటో అప్‌లోడ్':'Upload Batch Photo'}</div>
        {!imgSrc?(
          <div className={`upzone${drag?' drag':''}`}
               onDragOver={e=>{e.preventDefault();setDrag(true);}}
               onDragLeave={()=>setDrag(false)}
               onDrop={onDrop}
               onClick={()=>fileRef.current&&fileRef.current.click()}>
            <div style={{fontSize:40,marginBottom:8}}>📷</div>
            <div style={{fontWeight:600,marginBottom:4}}>{TE?'ఫోటోను ఇక్కడ వదలండి లేదా క్లిక్ చేయండి':'Drop a produce photo here or click to browse'}</div>
            <div style={{fontSize:12,color:'var(--muted)'}}>{TE?'కోసిన పంట కుప్ప / బస్తా ఫోటో ఉత్తమం':'A close-up of the harvested pile/sack works best'}</div>
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>
        ):(
          <div>
            <img src={imgSrc} alt="produce" style={{width:'100%',maxHeight:320,objectFit:'cover',borderRadius:'var(--rs)',marginBottom:12}}/>
            {!result&&!loading&&(
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-p" onClick={analyzeQuality}>🏅 {TE?'నాణ్యతను గ్రేడ్ చేయండి':'Grade Quality'}</button>
                <button className="btn btn-o" onClick={reset}>🔄 {TE?'మరొక ఫోటో':'Try Another'}</button>
              </div>
            )}
            {loading&&<div className="astep"><span style={{color:'var(--green)'}}>●</span>{amsg}</div>}
          </div>
        )}
      </div>

      {result&&!loading&&(
        <>
          <div className="card">
            <div className="qg-wrap">
              <div className="qg-grade-badge" style={{background:result.grade==='A+'||result.grade==='A'?'var(--green-l)':result.grade==='B'?'var(--amber-l)':'var(--red-l)'}}>
                <span className="qg-grade-letter" style={{color:result.grade==='A+'||result.grade==='A'?'var(--green-d)':result.grade==='B'?'var(--amber-d)':'var(--red-d)'}}>{result.grade}</span>
                <span className="qg-grade-sub" style={{color:result.grade==='A+'||result.grade==='A'?'var(--green-d)':result.grade==='B'?'var(--amber-d)':'var(--red-d)'}}>{result.qualityScore}/100</span>
              </div>
              <div style={{flex:1,minWidth:200}}>
                <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>{TE?result.gradeLabelTe:result.gradeLabelEn}</div>
                <span className={`qg-price-tag ${result.priceDeltaPct>=0?'up':'down'}`}>
                  {result.priceDeltaPct>=0?'📈':'📉'} {result.priceDeltaPct>=0?'+':''}{result.priceDeltaPct}% {TE?'ధర':'price'} · ₹{result.estPricePerQtl.toLocaleString('en-IN')}/{TE?'క్వి':'qtl'}
                </span>
              </div>
            </div>

            <div style={{marginTop:14}}>
              <div className="qg-param">
                <span>🎨 {TE?'రంగు & తాజాదనం':'Colour & Freshness'}</span>
                <div className="qg-param-bar"><div className="qg-param-fill" style={{width:`${result.freshness}%`,background:'var(--green)'}}/></div>
                <strong>{result.freshness}%</strong>
              </div>
              <div className="qg-param">
                <span>📏 {TE?'పరిమాణ ఏకరూపత':'Size Uniformity'}</span>
                <div className="qg-param-bar"><div className="qg-param-fill" style={{width:`${result.uniformityPct}%`,background:'var(--blue)'}}/></div>
                <strong>{result.uniformityPct}%</strong>
              </div>
              <div className="qg-param">
                <span>🔍 {TE?'తక్కువ లోపాలు':'Low Defect Level'}</span>
                <div className="qg-param-bar"><div className="qg-param-fill" style={{width:`${100-result.defectLevel}%`,background:result.defectLevel>45?'var(--red)':'var(--green)'}}/></div>
                <strong>{100-result.defectLevel}%</strong>
              </div>
              <div className="qg-param">
                <span>✨ {TE?'ఉపరితల షీన్':'Surface Sheen'}</span>
                <div className="qg-param-bar"><div className="qg-param-fill" style={{width:`${result.sheen}%`,background:'var(--purple)'}}/></div>
                <strong>{result.sheen}%</strong>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-title">⚠️ {TE?'హెచ్చరికలు & సూచనలు':'Alerts & Recommendations'}</div>
            {result.alerts.map((a,i)=>(
              <div key={i} className={`mon-alert ${a.sev}`}>
                <span className="mon-alert-icon">{a.icon}</span>
                <span>{TE?a.te:a.en}</span>
              </div>
            ))}
          </div>
        </>
      )}

      {history.length>0&&(
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
            <div className="card-title" style={{margin:0}}>{TE?'గ్రేడింగ్ చరిత్ర':'Grading History'}</div>
            <button className="hf" style={{borderColor:'var(--red-l)',color:'var(--red)'}}
              onClick={()=>{localStorage.removeItem('kd_quality_h');setHistory([]);}}>🗑 {TE?'తొలగించు':'Clear'}</button>
          </div>
          <div className="hlist">
            {history.slice(0,8).map(h=>(
              <div key={h.id} className="hitem">
                <div className="hdot" style={{background:h.grade==='A+'||h.grade==='A'?'#1D9E75':h.grade==='B'?'#EF9F27':'#E24B4A'}}/>
                <div className="hinfo">
                  <div className="hname">{CROP_DB[h.crop]?.emoji} {h.crop} — {TE?h.gradeLabelTe:h.gradeLabelEn}</div>
                  <div className="hmeta">{h.date} · ₹{h.estPricePerQtl.toLocaleString('en-IN')}/{TE?'క్వి':'qtl'}</div>
                </div>
                <div className="hright">
                  <div className="hconf" style={{color:h.grade==='A+'||h.grade==='A'?'#1D9E75':h.grade==='B'?'#EF9F27':'#E24B4A'}}>{h.grade}</div>
                  <div className="hsev" style={{background:h.grade==='A+'||h.grade==='A'?'#E1F5EE':h.grade==='B'?'#FAEEDA':'#FCEBEB',color:h.grade==='A+'||h.grade==='A'?'#085041':h.grade==='B'?'#633806':'#791F1F'}}>
                    {h.qualityScore}/100
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// BUYER MATCHING — connects a farmer's produce with the best-fit buyers
// Self-contained: uses only existing globals (CROPS, DIST_AP, DIST_TS, PX)
// ══════════════════════════════════════════════════════════════
const BM_BUYERS = [
  {id:1, name:'Sri Lakshmi Agro Traders', nameTe:'శ్రీ లక్ష్మి ఆగ్రో ట్రేడర్స్', type:'Trader', typeTe:'వ్యాపారి', district:'Guntur', crops:['Chilli','Cotton'], minQ:10, maxQ:500, grades:['A+','A','B'], premium:1.5, payDays:2, rating:4.6, phone:'+91 98480 10001'},
  {id:2, name:'Godavari Rice Mills', nameTe:'గోదావరి రైస్ మిల్స్', type:'Processor', typeTe:'ప్రాసెసర్', district:'West Godavari', crops:['Rice'], minQ:50, maxQ:2000, grades:['A+','A','B'], premium:2.0, payDays:5, rating:4.4, phone:'+91 98480 10002'},
  {id:3, name:'Kisan FPO Federation', nameTe:'కిసాన్ FPO సమాఖ్య', type:'FPO', typeTe:'రైతు ఉత్పత్తి సంఘం', district:'Kurnool', crops:['Groundnut','Cotton','Onion'], minQ:5, maxQ:300, grades:['A+','A','B','C'], premium:1.0, payDays:3, rating:4.7, phone:'+91 98480 10003'},
  {id:4, name:'Deccan Spice Exports', nameTe:'డెక్కన్ స్పైస్ ఎక్స్‌పోర్ట్స్', type:'Exporter', typeTe:'ఎగుమతిదారు', district:'Khammam', crops:['Chilli'], minQ:25, maxQ:1000, grades:['A+','A'], premium:4.5, payDays:7, rating:4.5, phone:'+91 98480 10004'},
  {id:5, name:'Nizam Oil & Extraction', nameTe:'నిజాం ఆయిల్ & ఎక్స్‌ట్రాక్షన్', type:'Processor', typeTe:'ప్రాసెసర్', district:'Warangal', crops:['Groundnut'], minQ:20, maxQ:800, grades:['A+','A','B'], premium:2.5, payDays:4, rating:4.2, phone:'+91 98480 10005'},
  {id:6, name:'Hyderabad Onion Hub', nameTe:'హైదరాబాద్ ఆనియన్ హబ్', type:'Trader', typeTe:'వ్యాపారి', district:'Hyderabad', crops:['Onion'], minQ:10, maxQ:600, grades:['A+','A','B','C'], premium:1.8, payDays:1, rating:4.3, phone:'+91 98480 10006'},
  {id:7, name:'Krishna Cotton Ginning Co.', nameTe:'కృష్ణా కాటన్ జిన్నింగ్', type:'Processor', typeTe:'ప్రాసెసర్', district:'Krishna', crops:['Cotton'], minQ:30, maxQ:1500, grades:['A+','A','B'], premium:3.0, payDays:6, rating:4.1, phone:'+91 98480 10007'},
  {id:8, name:'Rayalaseema Farmers Collective', nameTe:'రాయలసీమ రైతు సముదాయం', type:'FPO', typeTe:'రైతు ఉత్పత్తి సంఘం', district:'Ananthapuramu', crops:['Groundnut','Onion','Rice'], minQ:5, maxQ:250, grades:['A+','A','B','C'], premium:0.8, payDays:2, rating:4.8, phone:'+91 98480 10008'},
  {id:9, name:'Vizag Agri Exports', nameTe:'వైజాగ్ అగ్రి ఎక్స్‌పోర్ట్స్', type:'Exporter', typeTe:'ఎగుమతిదారు', district:'Visakhapatnam', crops:['Rice','Chilli'], minQ:100, maxQ:3000, grades:['A+','A'], premium:5.0, payDays:10, rating:4.4, phone:'+91 98480 10009'},
  {id:10, name:'Nalgonda Grain Merchants', nameTe:'నల్గొండ గ్రెయిన్ మర్చంట్స్', type:'Trader', typeTe:'వ్యాపారి', district:'Nalgonda', crops:['Rice','Cotton','Groundnut'], minQ:15, maxQ:700, grades:['A+','A','B','C'], premium:1.2, payDays:3, rating:4.0, phone:'+91 98480 10010'},
];

const BM_GRADES=['A+','A','B','C'];

function BuyerMatching({lang,showToast}){
  const TE=lang==='TE';
  const [crop,setCrop]=useState('Chilli');
  const [district,setDistrict]=useState('Guntur');
  const [qty,setQty]=useState(40);
  const [grade,setGrade]=useState('A');
  const [ask,setAsk]=useState('');
  const [sortBy,setSortBy]=useState('match');
  const [typeF,setTypeF]=useState('All');
  const [searched,setSearched]=useState(false);
  const [requested,setRequested]=useState(()=>{
    try{ return JSON.parse(localStorage.getItem('kd_bm_req')||'[]'); }catch{ return []; }
  });

  const mkt=(PX[crop]||[0]).slice(-1)[0];
  const stateOf=d=>DIST_AP.includes(d)?'AP':'TS';

  // Score each buyer 0-100 across five factors; crop mismatch = excluded
  const results=useMemo(()=>{
    const q=Number(qty)||0;
    const userAsk=Number(ask)||mkt;
    return BM_BUYERS
      .filter(b=>b.crops.includes(crop))
      .map(b=>{
        const gradeOk=b.grades.includes(grade);
        const qtyOk=q>=b.minQ&&q<=b.maxQ;
        const qtyScore=qtyOk?100:q<b.minQ?Math.max(0,100-((b.minQ-q)/b.minQ)*120):Math.max(0,100-((q-b.maxQ)/b.maxQ)*120);
        const near=b.district===district?100:stateOf(b.district)===stateOf(district)?65:30;
        const offer=Math.round(mkt*(1+b.premium/100));
        const priceScore=Math.max(0,Math.min(100,50+((offer-userAsk)/userAsk)*500+b.premium*6));
        const payScore=Math.max(0,100-(b.payDays-1)*9);
        const ratingScore=(b.rating/5)*100;
        const score=Math.round(
          (gradeOk?25:0)+ qtyScore*0.2 + near*0.2 + priceScore*0.2 + payScore*0.08 + ratingScore*0.07
        );
        const dist=b.district===district?'Same district':stateOf(b.district)===stateOf(district)?'Same state':'Other state';
        return {...b,gradeOk,qtyOk,near,offer,total:offer*q,score:Math.min(99,score),dist};
      });
  },[crop,district,qty,grade,ask,mkt]);

  const shown=useMemo(()=>{
    let r=results.filter(b=>typeF==='All'||b.type===typeF);
    if(sortBy==='match') r=[...r].sort((a,b)=>b.score-a.score);
    if(sortBy==='price') r=[...r].sort((a,b)=>b.offer-a.offer);
    if(sortBy==='pay') r=[...r].sort((a,b)=>a.payDays-b.payDays);
    if(sortBy==='near') r=[...r].sort((a,b)=>b.near-a.near||b.score-a.score);
    return r;
  },[results,typeF,sortBy]);

  function requestBuyer(b){
    if(requested.includes(b.id)){ showToast&&showToast(TE?'ఇప్పటికే అభ్యర్థన పంపబడింది':'Request already sent'); return; }
    const next=[...requested,b.id];
    setRequested(next);
    try{ localStorage.setItem('kd_bm_req',JSON.stringify(next)); }catch{}
    showToast&&showToast(TE?`${b.nameTe}కు అభ్యర్థన పంపబడింది`:`Request sent to ${b.name}`);
  }

  const scoreColor=s=>s>=75?['#E1F5EE','#085041','#1D9E75']:s>=50?['#FAEEDA','#633806','#EF9F27']:['#FCEBEB','#791F1F','#E24B4A'];
  const types=['All','Trader','Processor','FPO','Exporter'];
  const typeLbl={All:TE?'అన్నీ':'All',Trader:TE?'వ్యాపారి':'Trader',Processor:TE?'ప్రాసెసర్':'Processor',FPO:'FPO',Exporter:TE?'ఎగుమతిదారు':'Exporter'};
  const best=shown[0];

  return(
    <div className="page">
      <style>{`
        .bm-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
        .bm-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
        .bm-field input,.bm-field select{width:100%;padding:9px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit}
        .bm-field input:focus,.bm-field select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.14)}
        .bm-grade{display:flex;gap:6px}
        .bm-grade button{flex:1;padding:8px 0;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s}
        .bm-grade button.on{background:var(--green);border-color:var(--green);color:#fff}
        .bm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.15rem 1.25rem;margin-bottom:.85rem;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;animation:fadein .35s ease}
        .bm-card.top{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
        .bm-ring{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
        .bm-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .bm-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--blue-l);color:var(--blue-d)}
        .bm-tag.best{background:var(--green);color:#fff}
        .bm-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:5px}
        .bm-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
        .bm-chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
        .bm-ok{background:var(--green-l);color:var(--green-d)}
        .bm-warn{background:var(--amber-l);color:var(--amber-d)}
        .bm-bad{background:var(--red-l);color:var(--red-d)}
        .bm-right{text-align:right;min-width:150px}
        .bm-price{font-size:20px;font-weight:600;color:var(--green-d)}
        .bm-total{font-size:12px;color:var(--muted);margin:2px 0 8px}
        .bm-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1rem}
        .bm-sum div{background:var(--bg);border-radius:var(--rs);padding:10px 12px;text-align:center}
        .bm-sum b{display:block;font-size:19px;font-weight:600}
        .bm-sum span{font-size:11px;color:var(--muted)}
        @media(max-width:640px){.bm-card{grid-template-columns:52px 1fr}.bm-right{grid-column:1 / -1;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}.bm-total{margin:0}}
      `}</style>

      <h2 style={{fontSize:22,fontWeight:600,marginBottom:4}}>🤝 {TE?'కొనుగోలుదారు మ్యాచింగ్':'Buyer Matching'}</h2>
      <p style={{fontSize:13,color:'var(--muted)',marginBottom:'1.25rem'}}>
        {TE?'మీ పంట, పరిమాణం, గ్రేడ్ ఆధారంగా ఉత్తమ కొనుగోలుదారులను కనుగొనండి.':'Enter your produce details and get ranked buyers who fit your crop, quantity, grade and location.'}
      </p>

      <div className="card">
        <div className="bm-form">
          <div className="bm-field">
            <label>{TE?'పంట':'Crop'}</label>
            <select value={crop} onChange={e=>{setCrop(e.target.value);setAsk('');}}>
              {CROPS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="bm-field">
            <label>{TE?'జిల్లా':'Your district'}</label>
            <select value={district} onChange={e=>setDistrict(e.target.value)}>
              <optgroup label="Andhra Pradesh">{DIST_AP.map(d=><option key={d}>{d}</option>)}</optgroup>
              <optgroup label="Telangana">{DIST_TS.map(d=><option key={d}>{d}</option>)}</optgroup>
            </select>
          </div>
          <div className="bm-field">
            <label>{TE?'పరిమాణం (క్వింటాళ్లు)':'Quantity (quintals)'}</label>
            <input type="number" min="1" value={qty} onChange={e=>setQty(e.target.value)}/>
          </div>
          <div className="bm-field">
            <label>{TE?'కావలసిన ధర ₹/క్వి':'Expected ₹/qtl (optional)'}</label>
            <input type="number" min="0" placeholder={`${mkt.toLocaleString('en-IN')}`} value={ask} onChange={e=>setAsk(e.target.value)}/>
          </div>
          <div className="bm-field">
            <label>{TE?'నాణ్యత గ్రేడ్':'Quality grade'}</label>
            <div className="bm-grade">
              {BM_GRADES.map(g=><button key={g} className={grade===g?'on':''} onClick={()=>setGrade(g)}>{g}</button>)}
            </div>
          </div>
        </div>
        <div style={{marginTop:'1rem',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <button className="btn btn-p" disabled={!(Number(qty)>0)} onClick={()=>{setSearched(true);showToast&&showToast(TE?'కొనుగోలుదారులు కనుగొనబడ్డారు':`${results.length} buyers matched`);}}>
            🔍 {TE?'కొనుగోలుదారులను కనుగొను':'Find Buyers'}
          </button>
          <span style={{fontSize:12,color:'var(--muted)'}}>
            {TE?'ప్రస్తుత మార్కెట్ ధర':'Current market price'}: <b style={{color:'var(--text)'}}>₹{mkt.toLocaleString('en-IN')}/{TE?'క్వి':'qtl'}</b>
          </span>
        </div>
      </div>

      {searched&&(
        <>
          {shown.length>0&&best&&(
            <div className="card">
              <div className="bm-sum">
                <div><b>{shown.length}</b><span>{TE?'సరిపోలిన కొనుగోలుదారులు':'Buyers matched'}</span></div>
                <div><b style={{color:'var(--green)'}}>₹{Math.max(...shown.map(b=>b.offer)).toLocaleString('en-IN')}</b><span>{TE?'అత్యధిక ఆఫర్ /క్వి':'Highest offer / qtl'}</span></div>
                <div><b>₹{Math.max(...shown.map(b=>b.total)).toLocaleString('en-IN')}</b><span>{TE?'గరిష్ఠ మొత్తం':'Best total payout'}</span></div>
                <div><b>{Math.min(...shown.map(b=>b.payDays))} {TE?'రోజులు':'day(s)'}</b><span>{TE?'వేగవంతమైన చెల్లింపు':'Fastest payment'}</span></div>
              </div>
              <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}}>
                <div className="hfilt" style={{margin:0}}>
                  {types.map(t=><button key={t} className={`hf${typeF===t?' active':''}`} onClick={()=>setTypeF(t)}>{typeLbl[t]}</button>)}
                </div>
                <select className="sel-inp" value={sortBy} onChange={e=>setSortBy(e.target.value)}>
                  <option value="match">{TE?'ఉత్తమ మ్యాచ్':'Sort: Best match'}</option>
                  <option value="price">{TE?'అధిక ధర':'Sort: Highest price'}</option>
                  <option value="pay">{TE?'వేగవంతమైన చెల్లింపు':'Sort: Fastest payment'}</option>
                  <option value="near">{TE?'దగ్గరలో':'Sort: Nearest'}</option>
                </select>
              </div>
            </div>
          )}

          {shown.length===0&&(
            <div className="card hempty">
              <div style={{fontSize:40,marginBottom:8}}>🔎</div>
              {TE?'ఈ ఎంపికలకు కొనుగోలుదారులు దొరకలేదు. ఫిల్టర్ మార్చండి.':'No buyers found for these filters. Try a different type or crop.'}
            </div>
          )}

          {shown.map((b,i)=>{
            const [bg,fg,bar]=scoreColor(b.score);
            const sent=requested.includes(b.id);
            const isTop=sortBy==='match'&&i===0;
            return(
              <div key={b.id} className={`bm-card${isTop?' top':''}`}>
                <div className="bm-ring" style={{background:bg,color:fg,border:`3px solid ${bar}`}}>{b.score}%</div>
                <div>
                  <div className="bm-name">
                    {TE?b.nameTe:b.name}
                    <span className="bm-tag">{TE?b.typeTe:b.type}</span>
                    {isTop&&<span className="bm-tag best">⭐ {TE?'ఉత్తమ మ్యాచ్':'Best match'}</span>}
                  </div>
                  <div className="bm-meta">
                    <span>📍 {b.district} · {b.dist}</span>
                    <span>⭐ {b.rating}</span>
                    <span>💸 {TE?`${b.payDays} రోజుల్లో చెల్లింపు`:`Pays in ${b.payDays} day${b.payDays>1?'s':''}`}</span>
                  </div>
                  <div className="bm-chips">
                    <span className={`bm-chip ${b.gradeOk?'bm-ok':'bm-bad'}`}>{b.gradeOk?'✓':'✗'} {TE?`గ్రేడ్ ${grade}`:`Grade ${grade}`}</span>
                    <span className={`bm-chip ${b.qtyOk?'bm-ok':'bm-warn'}`}>{b.qtyOk?'✓':'!'} {b.minQ}–{b.maxQ} {TE?'క్వి':'qtl'}</span>
                    <span className="bm-chip bm-ok">+{b.premium}% {TE?'మార్కెట్ కంటే':'over market'}</span>
                  </div>
                </div>
                <div className="bm-right">
                  <div>
                    <div className="bm-price">₹{b.offer.toLocaleString('en-IN')}<span style={{fontSize:11,fontWeight:400,color:'var(--muted)'}}>/{TE?'క్వి':'qtl'}</span></div>
                    <div className="bm-total">{TE?'మొత్తం':'Total'} ₹{b.total.toLocaleString('en-IN')}</div>
                  </div>
                  <div style={{display:'flex',gap:6,justifyContent:'flex-end',flexWrap:'wrap'}}>
                    <a className="btn btn-o" style={{textDecoration:'none'}} href={`tel:${b.phone.replace(/\s/g,'')}`}>📞</a>
                    <button className={`btn ${sent?'btn-o':'btn-p'}`} onClick={()=>requestBuyer(b)}>
                      {sent?(TE?'✓ పంపబడింది':'✓ Sent'):(TE?'అభ్యర్థన పంపు':'Send Request')}
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
          <p style={{fontSize:11,color:'var(--muted)',textAlign:'center',marginTop:'.5rem'}}>
            {TE?'ఆఫర్ ధరలు సూచనాత్మకమైనవి; తుది ధర కొనుగోలుదారుతో నిర్ధారించండి.':'Offer prices are indicative (market price + buyer premium). Confirm the final price directly with the buyer.'}
          </p>
        </>
      )}
    </div>
  );
}
