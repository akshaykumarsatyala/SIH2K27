<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KrishiDost v2 — Smart Farming Platform</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <!-- Supabase (Auth + Postgres) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Telugu:ital@0;1&family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet"/>
<style>
:root{
  --green:#1D9E75;--green-l:#E1F5EE;--green-d:#085041;
  --amber:#EF9F27;--amber-l:#FAEEDA;--amber-d:#633806;
  --red:#E24B4A;--red-l:#FCEBEB;--red-d:#791F1F;
  --purple-l:#EEEDFE;--purple:#7F77DD;--purple-d:#3C3489;
  --blue-l:#E6F1FB;--blue:#378ADD;--blue-d:#0C447C;
  --bg:#F7F5F0;--surface:#FFF;--border:rgba(0,0,0,.08);
  --text:#1A1A1A;--muted:#6B6B6B;--r:12px;--rs:8px;
}
/* ── DARK MODE ── */
body.dark{
  --bg:#0F1117;--surface:#1A1D27;--border:rgba(255,255,255,.08);
  --text:#F0F0F0;--muted:#9A9A9A;
  --green-l:#0D2B22;--amber-l:#2B1F08;--red-l:#2B0E0E;
  --blue-l:#0E1E2B;--purple-l:#1A1840;
}
body.dark .card{background:var(--surface)}
body.dark input,body.dark select{background:#242736!important;color:var(--text)!important;border-color:rgba(255,255,255,.12)!important}
body.dark .upzone{background:var(--green-l)!important}
body.dark .ntab:hover{background:rgba(29,158,117,.15)}
body.dark .hitem:hover,body.dark .feat-row:hover{background:rgba(255,255,255,.04)}
/* ── WEATHER WIDGET ── */
.weather-widget{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1rem}
.weather-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rs);padding:12px 14px;text-align:center;position:relative;overflow:hidden}
.weather-icon{font-size:28px;margin-bottom:4px}
.weather-val{font-size:22px;font-weight:600;color:var(--text)}
.weather-label{font-size:11px;color:var(--muted);margin-top:2px}
.weather-sub{font-size:11px;color:var(--muted);margin-top:1px}
.weather-bar{height:3px;border-radius:99px;margin-top:6px;overflow:hidden;background:var(--bg)}
.weather-bar-fill{height:100%;border-radius:99px;transition:width 1s ease}
.weather-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;color:var(--muted);font-size:13px;background:var(--surface);border-radius:var(--rs);border:.5px solid var(--border)}
.dark-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;color:var(--text)}
.dark-btn:hover{border-color:var(--green);background:var(--green-l)}
/* ── SPLASH / LOAD ANIMATION ── */
.splash-screen{position:fixed;inset:0;background:linear-gradient(160deg,var(--green-d),var(--green));z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease,visibility .5s ease}
.splash-screen.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{font-size:52px;animation:splash-pop 1.1s ease-in-out infinite}
@keyframes splash-pop{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-4deg)}}
.splash-title{color:#fff;font-size:20px;font-weight:600;letter-spacing:.02em}
.splash-ring{width:36px;height:36px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.splash-sub{color:rgba(255,255,255,.75);font-size:12px}
.splash-progress-wrap{width:220px;height:6px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:2px}
.splash-progress-fill{height:100%;background:#fff;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.splash-pct{color:rgba(255,255,255,.65);font-size:11px;font-family:'DM Mono',monospace;letter-spacing:.03em}
/* Top route-change progress bar */
.top-loader{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--green),var(--amber));z-index:9998;transition:width .25s ease,opacity .3s ease;box-shadow:0 0 8px rgba(29,158,117,.6)}
/* Auth modal */
.auth-overlay{position:fixed;inset:0;background:rgba(8,20,15,.55);backdrop-filter:blur(2px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;animation:ov-in .2s ease}
@keyframes ov-in{from{opacity:0}to{opacity:1}}
.auth-modal{background:var(--surface);border-radius:calc(var(--r) + 4px);padding:1.85rem;width:100%;max-width:380px;box-shadow:0 24px 70px rgba(0,0,0,.3);position:relative;animation:modal-in .38s cubic-bezier(.34,1.56,.64,1)}
@keyframes modal-in{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-icon{width:46px;height:46px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px;animation:icon-pop .45s cubic-bezier(.34,1.56,.64,1) .1s both}
@keyframes icon-pop{from{opacity:0;transform:scale(.5) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}
/* Sliding pill switcher */
.auth-tabs{position:relative;display:flex;background:var(--bg);border-radius:99px;padding:3px;margin-bottom:18px}
.auth-tabs button{position:relative;z-index:1;flex:1;padding:8px 0;border:none;background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:color .25s ease}
.auth-tabs button.active{color:#fff}
.auth-tabs .auth-tab-thumb{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);background:var(--green);border-radius:99px;transition:transform .3s cubic-bezier(.65,0,.35,1);box-shadow:0 2px 8px rgba(29,158,117,.35)}
.auth-tabs .auth-tab-thumb.signup{transform:translateX(calc(100% + 3px))}
/* Fields */
.auth-modal input,.auth-modal select{width:100%;padding:10px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:10px;font-family:inherit;transition:border-color .18s ease,box-shadow .18s ease}
.auth-modal input:focus,.auth-modal select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.14)}
.auth-extra{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.auth-extra.open{grid-template-rows:1fr}
.auth-extra>div{overflow:hidden}
.auth-submit{width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .18s ease,transform .12s ease}
.auth-submit:hover:not(:disabled){background:var(--green-d)}
.auth-submit:active:not(:disabled){transform:scale(.98)}
.auth-submit:disabled{opacity:.75;cursor:not-allowed}
.auth-spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.auth-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.auth-switch span{color:var(--green-d);font-weight:600;cursor:pointer}
.auth-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);transition:transform .15s ease}
.auth-close:hover{transform:rotate(90deg)}
.auth-error{background:var(--red-l);color:var(--red-d);font-size:12px;padding:8px 10px;border-radius:var(--rs);margin-bottom:10px;animation:err-shake .35s ease}
@keyframes err-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.user-chip{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--green-l);color:var(--green-d);font-size:13px;font-weight:600;cursor:pointer;border:none}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;color:var(--green-d);cursor:pointer}
.nav-tabs{display:flex;gap:4px}
.nav-hamburger{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--green-d);padding:4px 6px;border-radius:6px}
.nav-hamburger:hover{background:var(--green-l)}
@media(max-width:700px){
  .nav-hamburger{display:inline-flex}
  .nav-tabs{display:none}
}
.nav-mobile-panel{position:absolute;top:60px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 14px 28px rgba(0,0,0,.1);display:flex;flex-direction:column;padding:8px;gap:2px;z-index:150;animation:navdrop .18s ease}
@keyframes navdrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.nav-mobile-panel .ntab{width:100%;text-align:left;padding:11px 14px;border-radius:8px}
@media(max-width:480px){
  .nav{padding:0 .85rem}
  .nav-logo{font-size:15px;gap:5px}
  .lang-btn{padding:5px 10px;font-size:11px}
  .dark-btn{width:30px;height:30px;font-size:14px}
  .page{padding:1.5rem 1rem}
}
.ntab{padding:6px 14px;border-radius:99px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all .15s}
.ntab:hover{background:var(--green-l);color:var(--green-d)}
.ntab.active{background:var(--green);color:#fff}
.lang-btn{padding:5px 14px;border-radius:99px;border:1.5px solid var(--green);background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:var(--green);transition:all .15s}
.lang-btn:hover{background:var(--green);color:#fff}
.page{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
/* ── Slow, staggered "section by section" reveal used across the Home page ── */
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1.15s cubic-bezier(.16,.8,.24,1),transform 1.15s cubic-bezier(.16,.8,.24,1);will-change:opacity,transform}
.reveal.show{opacity:1;transform:translateY(0)}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
/* ── Hero: split layout, illustrated collage + left-aligned copy ── */
.hero-wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:2.5rem;align-items:center;padding:2.5rem 0 3rem}
@media(max-width:800px){.hero-wrap{grid-template-columns:1fr;gap:1.5rem;padding:1.5rem 0 2rem}}
.hero-visual{position:relative;height:320px;min-width:0}
@media(max-width:800px){.hero-visual{height:220px;order:-1}}
.hv-blob{position:absolute;border-radius:50%;box-shadow:0 18px 40px rgba(0,0,0,.12)}
.hv-blob.soil{width:58%;aspect-ratio:1;left:0;top:6%;background:linear-gradient(150deg,#B08355,#8B5E34);display:flex;align-items:center;justify-content:center;animation:floaty 6s ease-in-out infinite}
.hv-blob.leaf{width:46%;aspect-ratio:1;right:2%;bottom:4%;background:linear-gradient(150deg,var(--green),var(--green-d));display:flex;align-items:center;justify-content:center;animation:floaty 6s ease-in-out infinite -3s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hv-rings{position:absolute;right:0;bottom:-6%;width:38%;aspect-ratio:1;border-radius:50%;overflow:hidden}
.hv-rings span{position:absolute;border:2px solid rgba(29,158,117,.22);border-radius:50%}
.hv-rings span:nth-child(1){inset:0}
.hv-rings span:nth-child(2){inset:14%}
.hv-rings span:nth-child(3){inset:28%}
.hv-rings span:nth-child(4){inset:42%;background:var(--green-l)}
.hv-pulse{position:absolute;left:8%;bottom:10%;width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(239,159,39,.55);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,159,39,.5)}70%{box-shadow:0 0 0 16px rgba(239,159,39,0)}100%{box-shadow:0 0 0 0 rgba(239,159,39,0)}}
.hero-text{text-align:left}
.hero-badge{display:inline-block;background:var(--green-l);color:var(--green-d);font-size:12px;font-weight:600;padding:4px 14px;border-radius:99px;margin-bottom:1rem}
.hero-text h1{font-size:clamp(28px,4.2vw,42px);font-weight:600;color:var(--green-d);line-height:1.18;margin-bottom:.85rem}
.hero-text p{font-size:15px;color:var(--muted);max-width:460px;margin:0 0 1.75rem;line-height:1.65}
.stats-row{display:flex;gap:2.25rem;flex-wrap:wrap}
.stat-n{font-size:26px;font-weight:600;color:var(--green)}
.stat-l{font-size:12px;color:var(--muted);margin-top:2px}
/* ── Bento feature grid: one featured tile + five regular ── */
.bento-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(150px,auto);gap:14px}
@media(max-width:800px){.bento-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.bento-grid{grid-template-columns:1fr;grid-auto-rows:auto}}
.bento-card{position:relative;border-radius:var(--r);padding:1.35rem;cursor:pointer;overflow:hidden;transition:transform .22s ease,box-shadow .22s ease;display:flex;flex-direction:column}
.bento-card.regular{background:var(--surface);border:1px solid var(--border)}
.bento-card.regular:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(29,158,117,.14);border-color:var(--green)}
.bento-card.featured{grid-row:span 2;color:#fff;justify-content:flex-end;min-height:360px}
@media(max-width:520px){.bento-card.featured{grid-row:auto;min-height:400px}}
.bento-card.featured:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(8,80,65,.35)}
.bc-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:10px}
.bento-card.featured .bc-icon{width:48px;height:48px;font-size:22px;background:rgba(255,255,255,.16)}
.bc-title{font-size:14.5px;font-weight:600;margin-bottom:4px}
.bento-card.featured .bc-title{font-size:19px;margin-bottom:6px}
.bc-desc{font-size:12px;color:var(--muted);line-height:1.5}
.bento-card.featured .bc-desc{color:rgba(255,255,255,.85);font-size:12.5px}
.bc-link{margin-top:10px;font-size:12.5px;font-weight:700;color:#fff;display:inline-flex;align-items:center;gap:4px;transition:gap .18s ease}
.bento-card.featured:hover .bc-link{gap:8px}
/* ── How it works ── */
.howit{margin-top:2.75rem}
.howit-title{font-size:20px;font-weight:600;color:var(--green-d);margin-bottom:1.5rem}
.howit-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
@media(max-width:700px){.howit-row{grid-template-columns:1fr;gap:1.25rem}}
.howit-step{position:relative;padding:0 1.25rem 0 0}
.howit-row .howit-step:not(:last-child)::after{content:'';position:absolute;top:22px;right:0;width:calc(100% - 56px);height:1px;background:repeating-linear-gradient(90deg,var(--border) 0 6px,transparent 6px 12px)}
@media(max-width:700px){.howit-row .howit-step::after{display:none}}
.howit-num{width:44px;height:44px;border-radius:50%;background:var(--green-l);color:var(--green-d);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative;z-index:1}
.howit-step h4{font-size:15px;font-weight:600;margin-bottom:5px}
.howit-step p{font-size:12.5px;color:var(--muted);line-height:1.55;max-width:260px}
/* ── Bottom CTA band ── */
.cta-band{margin-top:2.75rem;border-radius:var(--r);padding:2.5rem 2rem;background:linear-gradient(120deg,var(--green-d),var(--green));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
.cta-band h3{font-size:22px;font-weight:600;margin-bottom:6px}
.cta-band p{font-size:13px;opacity:.85;max-width:420px}
.cta-btn{background:#fff;color:var(--green-d);border:none;padding:12px 26px;border-radius:99px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .15s ease,box-shadow .15s ease}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1rem}
.card-title{font-size:16px;font-weight:600;margin-bottom:1rem}
.stitle{font-size:22px;font-weight:600;margin-bottom:1.5rem}
/* UPLOAD — Feature 1 */
.upzone{border:2px dashed rgba(29,158,117,.3);border-radius:var(--r);padding:3rem 2rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--green-l)}
.upzone:hover,.upzone.drag{border-color:var(--green);background:#d0efe5}
.up-icon{font-size:52px;margin-bottom:1rem;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.up-title{font-size:17px;font-weight:600;color:var(--green-d);margin-bottom:6px}
.up-sub{font-size:13px;color:var(--muted)}
.up-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:1.25rem}
.up-btn{padding:10px 22px;background:var(--green);color:#fff;border:none;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
.up-btn-sec{padding:10px 22px;background:transparent;color:var(--green-d);border:1.5px solid var(--green);border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
.img-wrap{position:relative;margin-bottom:1rem}
.img-prev{width:100%;max-height:240px;object-fit:cover;border-radius:var(--r);display:block}
.img-ovl{position:absolute;inset:0;background:rgba(0,0,0,.4);border-radius:var(--r);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;cursor:pointer}
.img-wrap:hover .img-ovl{opacity:1}
.img-ovl span{color:#fff;font-size:13px;font-weight:500}
/* Webcam capture modal — desktop/laptop camera */
.webcam-overlay{position:fixed;inset:0;background:rgba(8,20,15,.7);backdrop-filter:blur(2px);z-index:600;display:flex;align-items:center;justify-content:center;padding:1rem;animation:ov-in .2s ease}
.webcam-modal{background:var(--surface);border-radius:calc(var(--r) + 4px);padding:1.25rem;width:100%;max-width:520px;box-shadow:0 24px 70px rgba(0,0,0,.35);position:relative;animation:modal-in .35s cubic-bezier(.34,1.56,.64,1)}
.webcam-modal h4{font-size:15px;font-weight:600;color:var(--text);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.webcam-video-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3}
.webcam-video-wrap video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
.webcam-modal-btns{display:flex;gap:8px;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.webcam-shutter{width:60px;height:60px;border-radius:50%;background:var(--green);border:4px solid var(--green-l);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .12s ease}
.webcam-shutter:hover{transform:scale(1.06)}
.webcam-shutter:active{transform:scale(.94)}
.webcam-close{position:absolute;top:12px;right:14px;background:rgba(0,0,0,.35);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:15px;cursor:pointer;z-index:2}
.webcam-err{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:13px}
/* Analyze animation — Feature 1 */
.analyzing{text-align:center;padding:2.5rem 1rem}
.aring{width:56px;height:56px;border:3px solid var(--green-l);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.adots span{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin:0 3px;animation:blink 1.2s ease-in-out infinite}
.adots span:nth-child(2){animation-delay:.2s}
.adots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.astep{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;color:var(--muted)}
/* Result + Treatment — Feature 1 & 2 */
.rcard{border-radius:var(--r);overflow:hidden;border:1px solid var(--border);animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.rheader{padding:1.25rem 1.5rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.rdisease{font-size:21px;font-weight:600;margin-bottom:3px;line-height:1.3}
.rcrop{font-size:13px;color:var(--muted);margin-bottom:8px}
.cbar-wrap .cbar-lbl{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between}
.cbar{height:6px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden}
.cfill{height:100%;border-radius:99px;transition:width 1s ease}
.sbadge{padding:5px 13px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.s-red{background:var(--red-l);color:var(--red-d)}
.s-orange{background:var(--amber-l);color:var(--amber-d)}
.s-green{background:var(--green-l);color:var(--green-d)}
/* Treatment card — Feature 2 */
.tsec{padding:1.25rem 1.5rem;border-top:1px solid var(--border)}
.tlabel{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.ttext{font-size:14px;line-height:1.65}
.ttext.te{font-family:'Tiro Devanagari Telugu',serif;font-size:15px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.titem{background:var(--bg);border-radius:var(--rs);padding:10px 12px}
.titem-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.titem-val{font-size:13px;font-weight:500}
.titem-val.te{font-family:'Tiro Devanagari Telugu',serif}
.rbar-wrap{margin-top:12px}
.rbar{height:5px;background:rgba(0,0,0,.07);border-radius:99px;overflow:hidden;margin-top:4px}
.rfill{height:100%;background:var(--green);border-radius:99px;transition:width 1.2s ease .3s}
.ractions{display:flex;gap:8px;flex-wrap:wrap;padding:1.25rem 1.5rem;border-top:1px solid var(--border);background:var(--bg)}
/* Language toggle — Feature 3 */
.ltoggle{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:3px;gap:2px}
.lopt{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--muted);border:none;background:transparent}
.lopt.active{background:var(--surface);color:var(--green-d);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.te-pill{font-family:'Tiro Devanagari Telugu',serif;font-size:13px;color:var(--green-d);background:var(--green-l);padding:5px 12px;border-radius:var(--rs);display:inline-block;margin-top:8px;line-height:1.6}
/* History — Feature 4 */
.hlist{display:flex;flex-direction:column}
.hitem{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:var(--rs);transition:background .12s}
.hitem:hover{background:var(--bg)}
.hitem:last-child{border-bottom:none}
.hdot{width:10px;height:10px;min-width:10px;border-radius:50%}
.hinfo{flex:1}
.hname{font-size:13px;font-weight:600}
.hname.te{font-family:'Tiro Devanagari Telugu',serif}
.hmeta{font-size:11px;color:var(--muted);margin-top:2px}
.hexp{margin-top:8px;padding:8px 0;border-top:1px solid var(--border);font-size:12px;color:var(--text);line-height:1.6}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hconf{font-size:12px;font-weight:600}
.hsev{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.25rem}
.hstat{background:var(--bg);border-radius:var(--rs);padding:10px;text-align:center}
.hstat-n{font-size:20px;font-weight:600}
.hstat-l{font-size:11px;color:var(--muted);margin-top:2px}
.hfilt{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.hf{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .15s}
.hf.active{background:var(--green);color:#fff;border-color:var(--green)}
.hempty{text-align:center;padding:3rem 1rem;color:var(--muted)}
/* Step indicator */
.steps{display:flex;align-items:center;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.sdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;transition:all .3s}
.sline{flex:1;height:1px;min-width:20px;transition:background .5s}
/* Buttons */
.btn{padding:8px 18px;border-radius:99px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-p{background:var(--green);color:#fff}
.btn-p:hover{background:var(--green-d)}
.btn-p:disabled{background:#ccc;cursor:not-allowed}
.btn-o{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-o:hover{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.tab{padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all .15s}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
/* Price */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;cursor:pointer;transition:all .15s}
.pcard:hover,.pcard.sel{border-color:var(--green)}
.pcard.sel{background:var(--green-l)}
.pcrop{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.pprice{font-size:22px;font-weight:600}
.punit{font-size:10px;color:var(--muted)}
.pch{font-size:12px;font-weight:500;display:flex;align-items:center;gap:3px;margin-top:4px}
.pup{color:var(--green)}.pdn{color:var(--red)}
.spark{width:100%!important;height:30px!important;margin-top:6px}
.cw{position:relative;width:100%;height:280px}
.sel-inp{padding:8px 14px;border-radius:99px;border:1px solid var(--border);font-size:13px;background:var(--surface);color:var(--text);cursor:pointer}
/* ── CHATBOT FLOATING BUBBLE ── */
.chat-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 16px rgba(29,158,117,.45);z-index:500;transition:all .2s}
.chat-fab:hover{transform:scale(1.1);box-shadow:0 6px 24px rgba(29,158,117,.55)}
.chat-fab.open{background:var(--red)}
.chat-drawer{position:fixed;bottom:90px;right:24px;width:340px;max-height:520px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border);box-shadow:0 8px 40px rgba(0,0,0,.18);z-index:499;display:flex;flex-direction:column;overflow:hidden;animation:chatslide .25s ease}
@keyframes chatslide{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.chat-head{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.chat-head-info{flex:1}
.chat-head-title{font-size:14px;font-weight:600}
.chat-head-sub{font-size:11px;opacity:.8}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:340px}
.chat-msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.5;word-break:break-word}
.chat-msg.user{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.chat-msg.bot{background:var(--bg);color:var(--text);align-self:flex-start;border-bottom-left-radius:3px;border:1px solid var(--border)}
.chat-msg.typing{opacity:.6;font-style:italic}
.chat-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px}
.chat-input{flex:1;padding:8px 12px;border-radius:99px;border:1px solid var(--border);font-size:13px;background:var(--bg);color:var(--text);outline:none}
.chat-input:focus{border-color:var(--green)}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.chat-send:hover{background:var(--green-d)}
.chat-chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 12px 8px}
.chip{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap}
.chip:hover{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
@media(max-width:400px){.chat-drawer{width:calc(100vw - 32px);right:16px}}
/* ── MANDI MAP ── */
.mandi-map-wrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.mandi-popup-table{border-collapse:collapse;width:180px;font-size:12px}
.mandi-popup-table td{padding:3px 6px;border-bottom:1px solid #eee}
.mandi-popup-table tr:last-child td{border-bottom:none}
.mandi-popup-table .crop{font-weight:600;color:#085041}
.mandi-popup-table .price{color:#1D9E75;font-weight:700}
.bwrap{background:var(--green-l);border-radius:var(--rs);padding:12px 16px;margin-top:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.bwlabel{font-size:11px;font-weight:600;color:var(--green-d)}
.bwval{font-size:16px;font-weight:700;color:var(--green)}
.bwgain{font-size:12px;background:var(--green);color:#fff;padding:3px 10px;border-radius:99px;font-weight:500}
.alrt-inp{padding:8px 14px;border-radius:99px;border:1px solid var(--border);font-size:13px;background:var(--bg);width:170px}
.alrt-inp:focus{outline:none;border-color:var(--green)}
.alrt-badge{display:inline-flex;align-items:center;gap:6px;background:var(--amber-l);color:var(--amber-d);font-size:12px;font-weight:500;padding:4px 12px;border-radius:99px;margin-top:8px}
/* Toast */
.toast{position:fixed;top:70px;right:1rem;background:var(--green-d);color:#fff;padding:12px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:999;animation:si .3s ease;max-width:300px;line-height:1.4}
@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:700px){.two{grid-template-columns:1fr}.nav-tabs{display:none}.tgrid{grid-template-columns:1fr}}
/* ── Illustrated landscape banner (SVG, no external images) ── */
.landscape-banner{margin-top:2.75rem;border-radius:var(--r);overflow:hidden;position:relative;height:180px}
.landscape-banner svg{width:100%;height:100%;display:block}
.landscape-caption{position:absolute;left:1.75rem;right:1.75rem;bottom:1.5rem;color:#fff}
.landscape-caption .lc-title{font-size:17px;font-weight:700;margin-bottom:2px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.landscape-caption .lc-sub{font-size:12px;opacity:.9;text-shadow:0 2px 8px rgba(0,0,0,.25)}
@media(max-width:480px){
  .landscape-banner{height:150px}
  .landscape-caption{left:1.1rem;right:1.1rem;bottom:1.1rem}
  .landscape-caption .lc-title{font-size:15px}
  .landscape-caption .lc-sub{font-size:11px}
}
/* ── Testimonials grid ── */
.testi-title{font-size:20px;font-weight:600;color:var(--green-d);margin:2.75rem 0 1.25rem}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.testi-grid{grid-template-columns:1fr}}
.testi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;position:relative;transition:transform .2s ease,box-shadow .2s ease}
.testi-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(29,158,117,.12)}

/* ══════════════ HERO 2.0 — KhetiSathi-style landing hero ══════════════ */
.hero2{position:relative;overflow:hidden;border-radius:var(--r);padding:3.5rem 2.75rem;margin:1.25rem 0 2.5rem;
  background:linear-gradient(115deg,#FBEEDD 0%,#F6E4CC 55%,#EFE8E2 100%)}
body.dark .hero2{background:linear-gradient(115deg,#1c1710 0%,#201a12 55%,#171a16 100%)}
.hero2-stripes{position:absolute;top:-10px;left:18px;width:120px;height:220px;
  background-image:repeating-linear-gradient(115deg,rgba(29,158,117,.16) 0 2px,transparent 2px 14px);
  pointer-events:none}
.hero2-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:2.5rem;align-items:center}
@media(max-width:860px){.hero2-grid{grid-template-columns:1fr}.hero2{padding:2.25rem 1.5rem}}
.hero2-eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(29,158,117,.14);color:var(--green-d);
  font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 13px;border-radius:99px;margin-bottom:1.1rem}
.hero2-text h1{font-size:clamp(30px,4.4vw,46px);font-weight:700;color:var(--green-d);line-height:1.14;margin-bottom:1rem}
.hero2-text p{font-size:15.5px;color:var(--muted);max-width:460px;line-height:1.6;margin-bottom:1.75rem}
.hero2-btns{display:flex;gap:.75rem;flex-wrap:wrap}
.hero2-btn{padding:12px 26px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;border:1.5px solid transparent}
.hero2-btn:hover{transform:translateY(-2px)}
.hero2-btn.primary{background:var(--amber);color:var(--amber-d);box-shadow:0 8px 20px rgba(239,159,39,.35)}
.hero2-btn.primary:hover{box-shadow:0 12px 26px rgba(239,159,39,.45)}
.hero2-btn.outline{background:var(--surface);border-color:var(--border);color:var(--text)}
.hero2-btn.outline:hover{border-color:var(--green)}
.hero2-stats{display:flex;gap:2rem;margin-top:2rem;flex-wrap:wrap}
.hero2-stats div div:first-child{font-size:20px;font-weight:700;color:var(--green-d)}
.hero2-stats div div:last-child{font-size:11.5px;color:var(--muted);margin-top:2px}
.hero2-visual{position:relative;height:340px;display:flex;align-items:center;justify-content:center}
@media(max-width:860px){.hero2-visual{height:230px;order:-1}}
.hero2-blob{position:relative;width:82%;aspect-ratio:1;border-radius:50%;
  background:linear-gradient(155deg,#F0C994,#E8B879);display:flex;align-items:center;justify-content:center;
  box-shadow:0 24px 55px rgba(139,94,52,.25)}
.hero2-photo{position:absolute;inset:8%;border-radius:50%;overflow:hidden;
  background:linear-gradient(180deg,#EFE293 0%,#D8C24A 38%,#B9A233 100%);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.4)}
.hero2-photo svg{width:100%;height:100%;display:block}
.hero2-arcs{position:absolute;top:-14%;right:-10%;width:55%;aspect-ratio:1;opacity:.35;pointer-events:none}
body.dark .hero2-arcs{opacity:.2}
.hero2-wheel{position:absolute;left:-6%;bottom:2%;width:34%;aspect-ratio:1;opacity:.55}
.hero2-flag{position:absolute;right:6%;top:2%;font-size:26px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.15))}
.hero2-ring{position:absolute;inset:-4%;border-radius:50%;border:2px dashed rgba(29,158,117,.3);animation:spin 40s linear infinite}
.section-eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 .35rem}
.section-eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.section-eyebrow span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-d)}
.testi-quote{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:14px;min-height:88px}
.testi-foot{display:flex;align-items:center;gap:10px}
.testi-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.testi-name{font-size:12.5px;font-weight:700}
.testi-loc{font-size:11px;color:var(--muted)}
/* ── Site footer ── */
.site-footer{background:linear-gradient(160deg,#0A3B30,#062720);color:rgba(255,255,255,.85);margin-top:3rem}
.footer-inner{max-width:1100px;margin:0 auto;padding:3rem 1.5rem 1.5rem;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem}
@media(max-width:800px){.footer-inner{grid-template-columns:1fr 1fr;gap:1.75rem}}
@media(max-width:480px){.footer-inner{grid-template-columns:1fr}}
.footer-brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#fff;margin-bottom:10px}
.footer-tagline{font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.65);max-width:230px;margin-bottom:14px}
.footer-social{display:flex;gap:10px}
.footer-social a{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .18s ease,transform .18s ease}
.footer-social a:hover{background:var(--green);transform:translateY(-2px)}
.footer-col h5{font-size:12px;font-weight:700;letter-spacing:.03em;color:#fff;margin-bottom:12px}
.footer-col a,.footer-col button{display:block;background:none;border:none;text-align:left;padding:0;font-size:13px;color:rgba(255,255,255,.65);cursor:pointer;margin-bottom:9px;transition:color .15s ease;font-family:inherit}
.footer-col a:hover,.footer-col button:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding:14px 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;max-width:1100px;margin:0 auto;font-size:11.5px;color:rgba(255,255,255,.5)}
/* ══════════════════════════════════════════
   AI CROP MONITORING — new feature (additive only)
   ══════════════════════════════════════════ */
.mon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:1rem 0}
.mon-metric{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:14px;text-align:center}
.mon-metric-icon{font-size:24px;margin-bottom:4px}
.mon-metric-val{font-size:22px;font-weight:700}
.mon-metric-label{font-size:11px;color:var(--muted);margin-top:3px}
.mon-gauge-wrap{display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap;padding:1rem 0}
.mon-gauge{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;transition:background 1s ease}
.mon-gauge-inner{width:112px;height:112px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mon-gauge-score{font-size:30px;font-weight:700}
.mon-gauge-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.mon-alert{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--rs);font-size:13px;margin-bottom:8px;line-height:1.5}
.mon-alert.ok{background:var(--green-l);color:var(--green-d)}
.mon-alert.warn{background:var(--amber-l);color:var(--amber-d)}
.mon-alert.danger{background:var(--red-l);color:var(--red-d)}
.mon-alert-icon{font-size:16px}
.mon-stage-track{display:flex;gap:4px;margin:.75rem 0 .25rem}
.mon-stage-seg{flex:1;height:8px;border-radius:99px;background:var(--bg)}
.mon-stage-seg.done{background:var(--green)}
.mon-stage-seg.active{background:var(--amber)}
.mon-stage-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.mon-crop-chip{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--muted);transition:all .15s}
.mon-crop-chip.active{background:var(--green);border-color:var(--green);color:#fff}
.mon-trend-box{background:var(--bg);border-radius:var(--rs);padding:12px;margin-top:1rem}
@media(prefers-color-scheme:dark){}
body.dark .mon-metric{background:#242736}
body.dark .mon-gauge-inner{background:var(--surface)}
body.dark .mon-trend-box{background:#242736}
/* ══════════════════════════════════════════
   HARVEST PREDICTION — new feature (additive only)
   ══════════════════════════════════════════ */
.hv-countdown{display:flex;align-items:baseline;gap:8px;justify-content:center}
.hv-countdown-num{font-size:48px;font-weight:700;color:var(--green-d);line-height:1}
.hv-countdown-lbl{font-size:13px;color:var(--muted)}
.hv-ready-banner{background:var(--green-l);color:var(--green-d);border-radius:var(--rs);padding:12px 14px;text-align:center;font-weight:600;margin-bottom:1rem}
.hv-date-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:10px 0;border-top:1px solid var(--border);margin-top:12px;font-size:13px;color:var(--muted)}
.hv-date-row strong{color:var(--text)}
body.dark .hv-ready-banner{background:#0D2B22}
/* ══════════════════════════════════════════
   QUALITY GRADING — new feature (additive only)
   ══════════════════════════════════════════ */
.qg-grade-badge{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;margin:0 auto;flex-shrink:0}
.qg-grade-letter{font-size:34px;line-height:1}
.qg-grade-sub{font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;font-weight:600}
.qg-wrap{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;padding:.5rem 0}
.qg-param{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.qg-param:last-child{border-bottom:none}
.qg-param-bar{flex:1;height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin:0 10px}
.qg-param-fill{height:100%;border-radius:99px;transition:width 1s ease}
.qg-price-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700}
.qg-price-tag.up{background:var(--green-l);color:var(--green-d)}
.qg-price-tag.down{background:var(--red-l);color:var(--red-d)}
body.dark .qg-param{border-color:rgba(255,255,255,.08)}
</style>

// 🟢 SUPABASE SETUP — Auth + Postgres
// Project URL + publishable (anon) key — safe to expose client-side,
// access is governed by Row Level Security policies on the tables below.
//
// One-time SQL to run in the Supabase SQL editor (Table Editor → SQL):
//
//   create table public.profiles (
//     id uuid references auth.users on delete cascade primary key,
//     name text, email text, phone text, district text,
//     created_at timestamptz default now()
//   );
//   alter table public.profiles enable row level security;
//   create policy "Users manage their own profile" on public.profiles
//     for all using (auth.uid() = id) with check (auth.uid() = id);
//
//   create table public.history (
//     id uuid default gen_random_uuid() primary key,
//     user_id uuid references auth.users on delete cascade,
//     record jsonb, saved_at timestamptz default now()
//   );
//   alter table public.history enable row level security;
//   create policy "Users manage their own history" on public.history
//     for all using (auth.uid() = user_id) with check (auth.uid() = user_id);
//
// Also enable: Authentication → Providers → Email (on by default).
// ══════════════════════════════════════════════════════════════
const SUPABASE_URL = "https://knfijpaaddykjvdgsyht.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nJOOYPDBg4bC0j5g9khRWA_Pdttl3d5";

let sbClient = null, SUPABASE_READY = false;
try {
  if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    SUPABASE_READY = true;
  }
} catch (e) { console.warn('Supabase not configured yet:', e); }

// Normalise a Supabase auth user into the shape the rest of the app expects
// ({ uid, email, displayName }) so nothing else in the app needs to change.
function normalizeSbUser(u, fallbackName){
  if (!u) return null;
  return {
    uid: u.id,
    email: u.email,
    displayName: u.user_metadata?.full_name || fallbackName || '',
  };
}

// ── Auth helpers — mirror the Firebase-style API used elsewhere in the app ──
async function fbSignUp(name, email, password, phone, district){
  const { data, error } = await sbClient.auth.signUp({
    email, password,
    options: { data: { full_name: name } }
  });
  if (error) throw error;
  const user = data.user;
  // Best-effort profile row — signup still succeeds even if this table isn't set up yet
  try{
    await sbClient.from('profiles').upsert({
      id: user.id, name, email, phone: phone||'', district: district||'',
    });
  }catch(e){ console.warn('Could not save profile row (has the profiles table been created?)', e); }
  return normalizeSbUser(user, name);
}
async function fbLogIn(email, password){
  const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return normalizeSbUser(data.user);
}
async function fbLogOut(){ const { error } = await sbClient.auth.signOut(); if (error) throw error; }
async function fbGetProfile(uid){
  const { data, error } = await sbClient.from('profiles').select('*').eq('id', uid).single();
  if (error) return null;
  return data;
}
// Sync a locally-stored diagnosis/history record up to the logged-in user's Supabase table
async function fbSaveUserRecord(uid, record){
  if (!SUPABASE_READY || !uid) return;
  try{
    await sbClient.from('history').insert({ user_id: uid, record });
  }catch(e){ console.warn('Could not sync record to Supabase', e); }
}

// ── Live government mandi price fetch — data.gov.in Agmarknet (free, public dataset) ──
// This is the "Current Daily Price of Various Commodities from Various Markets (Mandi)" API.
// The key below is data.gov.in's published open sample key — works without signup, but is
// rate-limited/shared. For production, register your own free key at https://data.gov.in
// (Sign up → My Account → API keys) and swap it in.
const AGMARK_API_KEY = '579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571';
const AGMARK_RESOURCE = '9ef84268-d588-465a-a308-a864a43d0070';

async function fetchLiveMandiPrice(crop, stateName) {
  const commodity = CROP_PRICE_DB[crop]?.agmarkName;
  if (!commodity) return null;
  const url = `https://api.data.gov.in/resource/${AGMARK_RESOURCE}?api-key=${AGMARK_API_KEY}&format=json&limit=20&filters[state.keyword]=${encodeURIComponent(stateName)}&filters[commodity.keyword]=${encodeURIComponent(commodity)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('agmarknet fetch failed');
  const data = await res.json();
  const records = (data.records || []).filter(r => r.modal_price && !isNaN(parseFloat(r.modal_price)));
  if (!records.length) return null;
  const avg = Math.round(records.reduce((s, r) => s + parseFloat(r.modal_price), 0) / records.length);
  return { price: avg, market: records[0].market, date: records[0].arrival_date, sampleSize: records.length };
}

// ── Splash screen shown while the app loads ──
// Deliberately staged/slow (like many govt/agri portals) so it feels like it's
// really talking to a server rather than a stock 900ms flash.
function splashMessage(progress, TE){
  if (progress < 20) return TE?'సర్వర్‌కు కనెక్ట్ అవుతున్నది...':'Connecting to server...';
  if (progress < 40) return TE?'యూజర్ సెషన్ ధృవీకరిస్తున్నది...':'Authenticating session...';
  if (progress < 60) return TE?'పంట డేటాబేస్ లోడ్ అవుతున్నది...':'Loading crop database...';
  if (progress < 80) return TE?'ప్రభుత్వ సర్వర్ నుండి డేటా పొందుతున్నది, దయచేసి వేచి ఉండండి...':'Fetching data from govt. server, please wait...';
  if (progress < 97) return TE?'డాష్‌బోర్డ్ సిద్ధం చేస్తున్నది...':'Preparing your dashboard...';
  return TE?'దాదాపు సిద్ధం...':'Almost ready...';
}

// ── Thin progress bar shown briefly on tab/page changes ──
function TopLoader({active}){
  const [width,setWidth]=useState(0);
  useEffect(()=>{
    if(active){
      setWidth(20);
      const t1=setTimeout(()=>setWidth(70),120);
      return ()=>clearTimeout(t1);
    } else {
      setWidth(100);
      const t2=setTimeout(()=>setWidth(0),300);
      return ()=>clearTimeout(t2);
    }
  },[active]);
  if(width===0) return null;
  return <div className="top-loader" style={{width:`${width}%`,opacity:active||width===100?1:0}}/>;
}

// ── Login / Sign up modal ──
function AuthModal({lang, onClose, onAuthed}){
  const TE = lang === 'TE';
  const [mode,setMode]=useState('login'); // 'login' | 'signup'
  const [name,setName]=useState('');
  const [email,setEmail]=useState('');
  const [phone,setPhone]=useState('');
  const [district,setDistrict]=useState('');
  const [password,setPassword]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');

  async function submit(e){
    e.preventDefault();
    setErr('');
    if (!SUPABASE_READY){
      setErr(TE
        ? 'Supabase కాన్ఫిగర్ చేయలేదు. స్క్రిప్ట్ పైభాగంలో SUPABASE_URL మరియు SUPABASE_ANON_KEY నింపండి.'
        : 'Supabase isn\'t configured yet. Add your project URL and anon key to the top of the script.');
      return;
    }
    setBusy(true);
    try{
      let user;
      if (mode==='signup'){
        if(!name||!email||!password) throw new Error(TE?'అన్ని వివరాలు నింపండి':'Please fill all required fields');
        if(password.length<6) throw new Error(TE?'పాస్‌వర్డ్ కనీసం 6 అక్షరాలు ఉండాలి':'Password must be at least 6 characters');
        user = await fbSignUp(name, email, password, phone, district);
      } else {
        user = await fbLogIn(email, password);
      }
      onAuthed(user);
    }catch(ex){
      const msg = ex?.message || String(ex);
      setErr(msg.replace('Firebase: ','').replace(/\(auth\/[a-z-]+\)\.?/,'').trim());
    }finally{
      setBusy(false);
    }
  }

  function switchMode(m){ if(m!==mode){ setMode(m); setErr(''); } }

  return (
    <div className="auth-overlay" onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="auth-modal">
        <button className="auth-close" onClick={onClose}>✕</button>
        <div className="auth-icon">{mode==='login' ? '🌾' : '🌱'}</div>
        <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>
          {mode==='login' ? (TE?'లాగిన్ చేయండి':'Log in') : (TE?'ఖాతా సృష్టించండి':'Create your account')}
        </div>
        <div style={{fontSize:13,color:'var(--muted)',marginBottom:16}}>
          {mode==='login'
            ? (TE?'మీ KrishiDost ఖాతాలోకి ప్రవేశించండి':'Welcome back to KrishiDost')
            : (TE?'ఉచితంగా నమోదు చేసుకోండి':'Free — takes less than a minute')}
        </div>

        {/* Sliding pill tab switcher */}
        <div className="auth-tabs">
          <div className={`auth-tab-thumb ${mode==='signup'?'signup':''}`}></div>
          <button type="button" className={mode==='login'?'active':''} onClick={()=>switchMode('login')}>{TE?'లాగిన్':'Log in'}</button>
          <button type="button" className={mode==='signup'?'active':''} onClick={()=>switchMode('signup')}>{TE?'నమోదు':'Sign up'}</button>
        </div>

        {err && <div className="auth-error">⚠️ {err}</div>}
        {!SUPABASE_READY && (
          <div className="auth-error">
            {TE?'⚙️ డెమో మోడ్: Supabase కీలు ఇంకా జోడించలేదు.':'⚙️ Setup needed: add your Supabase project keys in the code to enable real sign-up/login and data storage.'}
          </div>
        )}
        <form onSubmit={submit}>
          {/* Signup-only fields smoothly expand/collapse instead of popping in */}
          <div className={`auth-extra ${mode==='signup'?'open':''}`}>
            <div>
              <input placeholder={TE?'పూర్తి పేరు':'Full name'} value={name} onChange={e=>setName(e.target.value)} required={mode==='signup'}/>
              <input placeholder={TE?'ఫోన్ నంబర్ (ఐచ్ఛికం)':'Phone number (optional)'} value={phone} onChange={e=>setPhone(e.target.value)}/>
              <select value={district} onChange={e=>setDistrict(e.target.value)}>
                <option value="">{TE?'జిల్లా ఎంచుకోండి (ఐచ్ఛికం)':'Select district (optional)'}</option>
                <optgroup label="AP">{DIST_AP.map(d=><option key={d}>{d}</option>)}</optgroup>
                <optgroup label="TS">{DIST_TS.map(d=><option key={d}>{d}</option>)}</optgroup>
              </select>
            </div>
          </div>
          <input type="email" placeholder={TE?'ఇమెయిల్':'Email'} value={email} onChange={e=>setEmail(e.target.value)} required/>
          <input type="password" placeholder={TE?'పాస్‌వర్డ్':'Password'} value={password} onChange={e=>setPassword(e.target.value)} required/>
          <button className="auth-submit" type="submit" disabled={busy}>
            {busy && <span className="auth-spin"></span>}
            {busy ? (TE?'దయచేసి వేచి ఉండండి...':'Please wait...') : mode==='login' ? (TE?'లాగిన్':'Log in') : (TE?'నమోదు':'Sign up')}
          </button>
        </form>
        <div className="auth-switch">
          {mode==='login' ? (
            <>{TE?'ఖాతా లేదా?':"Don't have an account?"} <span onClick={()=>switchMode('signup')}>{TE?'నమోదు చేసుకోండి':'Sign up'}</span></>
          ) : (
            <>{TE?'ఇప్పటికే ఖాతా ఉందా?':'Already have an account?'} <span onClick={()=>switchMode('login')}>{TE?'లాగిన్':'Log in'}</span></>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Open-Meteo weather-code → icon/description mapping (no API key needed) ──
function wmoToIcon(code){
  if(code===0) return {icon:'☀️',desc:'Clear sky'};
  if([1,2].includes(code)) return {icon:'🌤',desc:'Mostly clear'};
  if(code===3) return {icon:'⛅',desc:'Cloudy'};
  if([45,48].includes(code)) return {icon:'🌫',desc:'Fog'};
  if([51,53,55,56,57].includes(code)) return {icon:'🌦',desc:'Drizzle'};
  if([61,63,65,80,81,82].includes(code)) return {icon:'🌧',desc:'Rain'};
  if([66,67].includes(code)) return {icon:'🌧',desc:'Freezing rain'};
  if([71,73,75,77,85,86].includes(code)) return {icon:'🌨',desc:'Snow'};
  if([95,96,99].includes(code)) return {icon:'⛈',desc:'Thunderstorm'};
  return {icon:'⛅',desc:'Partly cloudy'};
}

function WeatherWidget({district, lang}) {
  const TE = lang === 'TE';
  const [wx, setWx]       = useState(null);
  const [loading, setLoading] = useState(true);
  const [localDistrict, setLocalDistrict] = useState(district || 'Guntur');
  const [usingGPS, setUsingGPS] = useState(false);
  const [gpsLabel, setGpsLabel] = useState('');

  // Fetch live current weather from Open-Meteo (free, keyless, no rate limit for normal use)
  function fetchWeather(lat, lon, label){
    setLoading(true);
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,wind_speed_10m,weather_code&timezone=auto`)
      .then(r => r.json())
      .then(data => {
        const c = data.current;
        if (!c) throw new Error('no current data');
        const wcode = wmoToIcon(c.weather_code);
        setWx({
          temp: Math.round(c.temperature_2m),
          feels: Math.round(c.apparent_temperature),
          humidity: Math.round(c.relative_humidity_2m),
          rain: c.precipitation_probability ?? 20,
          wind: Math.round(c.wind_speed_10m),
          desc: wcode.desc,
          icon: wcode.icon,
          live: true,
        });
        if(label) setGpsLabel(label);
      })
      .catch(() => {
        // Fallback to realistic mock data if the API is unreachable
        setWx({...(WEATHER_DATA[localDistrict] || DEFAULT_WEATHER), live:false});
      })
      .finally(() => setLoading(false));
  }

  useEffect(() => {
    if (usingGPS) return; // GPS-based location handled by its own effect
    const coords = DISTRICT_COORDS[localDistrict];
    if (!coords) { setWx({...(WEATHER_DATA[localDistrict] || DEFAULT_WEATHER), live:false}); setLoading(false); return; }
    fetchWeather(coords[0], coords[1]);
  }, [localDistrict, usingGPS]);

  function useMyLocation(){
    if (!navigator.geolocation) return;
    setUsingGPS(true);
    setLoading(true);
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeather(pos.coords.latitude, pos.coords.longitude, TE?'మీ ప్రస్తుత స్థానం':'Your current location'),
      () => { setUsingGPS(false); fetchWeather(...(DISTRICT_COORDS[localDistrict]||[16.3,80.4])); },
      {timeout:8000}
    );
  }

  const w = wx || DEFAULT_WEATHER;
  const rainColor = w.rain > 60 ? 'var(--red)' : w.rain > 30 ? 'var(--amber)' : 'var(--blue)';
  const tempColor = w.temp > 38 ? 'var(--red)' : w.temp > 32 ? 'var(--amber)' : 'var(--green)';
  const farmingTip = (r, t, lang) => {
    if (lang === 'TE') {
      if (r > 70) return '⚠️ పురుగుమందు పిచికారీ వద్దు — వర్షం వస్తుంది';
      if (r > 40) return '💧 నీటిపారుదల తగ్గించండి — వర్షం అంచనా';
      if (t > 38) return '🌡️ మొక్కలకు తగినంత నీరు ఇవ్వండి — అత్యధిక వేడి';
      return '✅ రైతుకు అనుకూలమైన వాతావరణం';
    }
    if (r > 70) return '⚠️ Avoid spraying pesticides — rain expected';
    if (r > 40) return '💧 Reduce irrigation — rain likely today';
    if (t > 38) return '🌡️ Increase watering — extreme heat alert';
    return '✅ Good farming conditions today';
  };

  return (
    <div className="card" style={{marginBottom:'1.25rem'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.75rem',flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:18}}>☁️</span>
          <span style={{fontSize:14,fontWeight:600}}>{TE?'ఈరోజు వాతావరణం':'Today\'s Weather'}</span>
          {wx && !loading && (
            <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:99,
              background:wx.live?'var(--green-l)':'var(--amber-l)',color:wx.live?'var(--green-d)':'var(--amber-d)'}}>
              {wx.live ? (TE?'లైవ్':'LIVE') : (TE?'అంచనా':'ESTIMATE')}
            </span>
          )}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <button onClick={useMyLocation} title={TE?'నా ప్రస్తుత స్థానం వాడండి':'Use my current location'}
            style={{padding:'4px 10px',borderRadius:99,border:'1px solid var(--green)',background:usingGPS?'var(--green)':'transparent',color:usingGPS?'#fff':'var(--green-d)',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            📍 {TE?'నా స్థానం':'My location'}
          </button>
          <select value={localDistrict} onChange={e=>{setUsingGPS(false); setLocalDistrict(e.target.value);}}
            style={{padding:'4px 10px',borderRadius:99,border:'1px solid var(--border)',fontSize:12,background:'var(--surface)',color:'var(--text)'}}>
            <optgroup label="AP">{DIST_AP.map(d=><option key={d}>{d}</option>)}</optgroup>
            <optgroup label="TS">{DIST_TS.map(d=><option key={d}>{d}</option>)}</optgroup>
          </select>
        </div>
      </div>
      {usingGPS && gpsLabel && !loading && (
        <div style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>📍 {gpsLabel}</div>
      )}

      {loading ? (
        <div className="weather-loading">
          <div className="aring" style={{width:20,height:20,borderWidth:2,margin:0,borderTopColor:'var(--blue)'}}></div>
          {TE?'వాతావరణం లోడ్ అవుతున్నది...':'Loading weather...'}
        </div>
      ) : (
        <>
          <div className="weather-widget">
            {/* Temperature */}
            <div className="weather-card">
              <div className="weather-icon">{w.icon}</div>
              <div className="weather-val" style={{color:tempColor}}>{w.temp}°C</div>
              <div className="weather-label">{TE?'ఉష్ణోగ్రత':'Temperature'}</div>
              <div className="weather-sub">{TE?`అనుభూతి ${w.feels}°C`:`Feels ${w.feels}°C`}</div>
              <div className="weather-bar"><div className="weather-bar-fill" style={{width:`${Math.min(w.temp/45*100,100)}%`,background:tempColor}}/></div>
            </div>
            {/* Rain */}
            <div className="weather-card">
              <div className="weather-icon">🌧</div>
              <div className="weather-val" style={{color:rainColor}}>{w.rain}%</div>
              <div className="weather-label">{TE?'వర్షం అంచనా':'Rain Chance'}</div>
              <div className="weather-sub">{w.rain>60?(TE?'వర్షం సాధ్యం':'Rain likely'):w.rain>30?(TE?'మేఘావృతం':'Partly cloudy'):(TE?'వర్షం లేదు':'Clear')}</div>
              <div className="weather-bar"><div className="weather-bar-fill" style={{width:`${w.rain}%`,background:rainColor}}/></div>
            </div>
            {/* Humidity */}
            <div className="weather-card">
              <div className="weather-icon">💧</div>
              <div className="weather-val" style={{color:'var(--blue)'}}>{w.humidity}%</div>
              <div className="weather-label">{TE?'తేమ':'Humidity'}</div>
              <div className="weather-sub">{w.humidity>75?(TE?'అధికం':'High'):w.humidity>55?(TE?'మధ్యస్థ':'Moderate'):(TE?'తక్కువ':'Low')}</div>
              <div className="weather-bar"><div className="weather-bar-fill" style={{width:`${w.humidity}%`,background:'var(--blue)'}}/></div>
            </div>
            {/* Wind */}
            <div className="weather-card">
              <div className="weather-icon">💨</div>
              <div className="weather-val" style={{color:'var(--muted)'}}>{w.wind}</div>
              <div className="weather-label">{TE?'గాలి వేగం km/h':'Wind km/h'}</div>
              <div className="weather-sub">{w.wind>25?(TE?'బలమైన':'Strong'):w.wind>15?(TE?'మధ్యస్థ':'Moderate'):(TE?'తేలికైన':'Light')}</div>
              <div className="weather-bar"><div className="weather-bar-fill" style={{width:`${Math.min(w.wind/40*100,100)}%`,background:'var(--muted)'}}/></div>
            </div>
          </div>
          {/* Farming tip */}
          <div style={{background:w.rain>70?'var(--red-l)':w.temp>38?'var(--amber-l)':'var(--green-l)',borderRadius:'var(--rs)',padding:'8px 12px',fontSize:12,fontWeight:500,color:w.rain>70?'var(--red-d)':w.temp>38?'var(--amber-d)':'var(--green-d)'}}>
            {farmingTip(w.rain, w.temp, lang)}
          </div>
        </>
      )}
    </div>
  );
}

// ── Early Warning Alerts — combines live weather risk with nearby pest
// outbreaks (from the same `reports` data Pest Map uses) into a single
// glanceable panel, shown at the top of the Home dashboard. ──
function EarlyWarnings({ lang, reports }) {
  const TE = lang === 'TE';
  const [district, setDistrict] = useState('Guntur');
  const [wx, setWx] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const coords = DISTRICT_COORDS[district];
    if (!coords) { setWx(WEATHER_DATA[district] || DEFAULT_WEATHER); setLoading(false); return; }
    setLoading(true);
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}&longitude=${coords[1]}&current=temperature_2m,relative_humidity_2m,precipitation_probability,wind_speed_10m&timezone=auto`)
      .then(r => r.json())
      .then(data => {
        const c = data.current;
        if (!c) throw new Error('no current data');
        setWx({
          temp: Math.round(c.temperature_2m),
          humidity: Math.round(c.relative_humidity_2m),
          rain: c.precipitation_probability ?? 20,
          wind: Math.round(c.wind_speed_10m),
        });
      })
      .catch(() => setWx(WEATHER_DATA[district] || DEFAULT_WEATHER))
      .finally(() => setLoading(false));
  }, [district]);

  const alerts = [];
  if (wx) {
    if (wx.rain > 70) alerts.push({ sev:'high', icon:'🌧️',
      en:'Heavy rain expected — delay spraying pesticides and postpone harvest if possible.',
      te:'భారీ వర్షం అంచనా — పురుగుమందు పిచికారీ వాయిదా వేయండి, వీలైతే కోతను కూడా వాయిదా వేయండి.' });
    if (wx.temp > 40) alerts.push({ sev:'high', icon:'🌡️',
      en:'Extreme heat alert — irrigate early morning or evening and shade young plants.',
      te:'తీవ్ర వేడి హెచ్చరిక — ఉదయం లేదా సాయంత్రం నీరు పెట్టండి, లేత మొక్కలకు నీడ ఇవ్వండి.' });
    if (wx.humidity > 80 && wx.temp > 24) alerts.push({ sev:'medium', icon:'🍄',
      en:'High humidity — fungal disease risk is elevated, inspect crops closely.',
      te:'అధిక తేమ — ఫంగల్ వ్యాధి ప్రమాదం ఎక్కువగా ఉంది, పంటలను జాగ్రత్తగా పరిశీలించండి.' });
    if (wx.wind > 30) alerts.push({ sev:'medium', icon:'💨',
      en:'Strong winds forecast — secure stored produce and any greenhouse/net covers.',
      te:'బలమైన గాలుల అంచనా — నిల్వ చేసిన పంటను, గ్రీన్‌హౌస్ కవర్లను భద్రపరచండి.' });
  }
  const ob = getOutbreaks(reports).find(o => o.district === district);
  if (ob) alerts.push({
    sev: ob.count >= 5 ? 'high' : 'medium', icon:'🐛',
    en:`${ob.pest} outbreak detected nearby — ${ob.count} reports in ${district}. Inspect your crop today.`,
    te:`సమీపంలో ${PEST_TE[ob.pest]||ob.pest} వ్యాప్తి గుర్తించబడింది — ${district}లో ${ob.count} నివేదికలు. ఈరోజు మీ పంటను పరిశీలించండి.`,
  });

  // ── Predictive risk — runs even with ZERO reports yet, purely off live
  // weather + season + any nearby history, so it can fire before ob (above)
  // ever would. Checked across every crop grown in this district's history
  // (or the full pest catalogue's crops if the district has no history). ──
  const predictions = wx
    ? Object.keys(CROP_PESTS)
        .map(crop => predictOutbreakRisk({ wx, crop, district, reports }))
        .filter(Boolean)
        .sort((a, b) => b.score - a.score)
    : [];
  const topPrediction = predictions[0];
  // Skip if this exact pest was already flagged by the reactive alert above.
  if (topPrediction && (!ob || ob.pest !== topPrediction.pest)) alerts.push({
    sev: topPrediction.level === 'high' ? 'high' : 'medium', icon:'🔮',
    en:`Conditions currently favour a ${topPrediction.pest} outbreak on ${topPrediction.crop} in ${district} this ${topPrediction.season} season — inspect crops closely and consider a preventive spray.`,
    te:`${district}లో ప్రస్తుత వాతావరణం ${topPrediction.crop} పంటపై ${PEST_TE[topPrediction.pest]||topPrediction.pest} వ్యాప్తికి అనుకూలంగా ఉంది — పంటలను జాగ్రత్తగా పరిశీలించి ముందుజాగ్రత్త పిచికారీ చేయండి.`,
  });

  return (
    <div className="card" style={{marginBottom:'1.25rem', borderColor: alerts.some(a=>a.sev==='high') ? 'var(--red)' : undefined}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'0.75rem',flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:18}}>🚨</span>
          <span style={{fontSize:14,fontWeight:600}}>{TE?'ముందస్తు హెచ్చరికలు':'Early Warning Alerts'}</span>
        </div>
        <select value={district} onChange={e=>setDistrict(e.target.value)}
          style={{padding:'4px 10px',borderRadius:99,border:'1px solid var(--border)',fontSize:12,background:'var(--surface)',color:'var(--text)'}}>
          <optgroup label="AP">{DIST_AP.map(d=><option key={d}>{d}</option>)}</optgroup>
          <optgroup label="TS">{DIST_TS.map(d=><option key={d}>{d}</option>)}</optgroup>
        </select>
      </div>
      {loading ? (
        <div className="weather-loading">
          <div className="aring" style={{width:20,height:20,borderWidth:2,margin:0,borderTopColor:'var(--red)'}}></div>
          {TE?'తనిఖీ చేస్తున్నది...':'Checking conditions...'}
        </div>
      ) : alerts.length === 0 ? (
        <div style={{fontSize:13,color:'var(--green-d)',background:'var(--green-l)',borderRadius:'var(--rs)',padding:'10px 12px'}}>
          ✅ {TE?'ప్రస్తుతం హెచ్చరికలు లేవు — పరిస్థితులు సాధారణంగా ఉన్నాయి.':'No warnings right now — conditions look normal.'}
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {alerts.map((a,i)=>(
            <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'9px 12px',borderRadius:'var(--rs)',
              background:a.sev==='high'?'var(--red-l)':'var(--amber-l)', color:a.sev==='high'?'var(--red-d)':'var(--amber-d)'}}>
              <span style={{fontSize:16}}>{a.icon}</span>
              <span style={{fontSize:12,fontWeight:500,lineHeight:1.5}}>{TE?a.te:a.en}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Slow-reveal hook: fades/slides an element in once it's on screen (or, if
// it's already in the viewport at mount — like the hero — shortly after
// mount), with an optional per-element delay so a group of elements can be
// staggered into view one after another instead of popping in all at once. ──
function useReveal(delayMs=0){
  const ref=useRef(null);
  const [shown,setShown]=useState(false);
  useEffect(()=>{
    const el=ref.current;
    if(!el) return;
    let timer=null;
    const obs=new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          timer=setTimeout(()=>setShown(true), delayMs);
          obs.unobserve(el);
        }
      });
    },{threshold:0.12});
    obs.observe(el);
    return ()=>{ obs.disconnect(); if(timer) clearTimeout(timer); };
  },[delayMs]);
  return [ref, 'reveal'+(shown?' show':'')];
}
// Convenience wrapper around useReveal so JSX can just do
// <Reveal delay={150} className="...">...</Reveal> instead of wiring up a
// ref + className by hand on every section.
function Reveal({as:As='div', delay=0, className='', children, ...rest}){
  const [ref,cls]=useReveal(delay);
  return <As ref={ref} className={(className?className+' ':'')+cls} {...rest}>{children}</As>;
}

// ── Real on-device image analysis (canvas pixel sampling) ──
function analyzeImagePixels(imgEl) {
  const canvas = document.createElement('canvas');
  const w = canvas.width = 120, h = canvas.height = 120;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgEl, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  let green = 0, brownYellow = 0, total = 0;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    total++;
    if (g > r && g > b && g > 60) green++;
    else if (r > 100 && g > 55 && b < 100 && r >= g) brownYellow++;
  }
  return { greenRatio: green/total, brownYellowRatio: brownYellow/total };
}

    "Prakasam":-25,"Sri Potti Sriramulu Nellore":-10,"Palnadu":-35,
    "Dr. B.R. Ambedkar Konaseema":20,
    // Telangana

    "Nalgonda":25,"Suryapet":20,"Khammam":30,"Bhadradri Kothagudem":15,

            <div className="bwrap" style={{marginTop:'1rem'}}>

              <div><div className="bwlabel">{TE?'అంచనా గరిష్ట ధర':'Expected Peak'}</div><div className="bwval">₹{peakForecast.toLocaleString('en-IN')}/qtl</div></div>

      {/* ── MANDI MAP TAB ── */}

function MandiMap({lang, selectedCrop}) {
  const TE = lang === 'TE';
  const mapRef  = useRef(null);
  const mapInst = useRef(null);
  const [filterCrop, setFilterCrop] = useState(selectedCrop || 'Chilli');
  const [selected, setSelected]     = useState(null);

  useEffect(()=>{
    if (!mapRef.current) return;
    function init() {
      if (mapInst.current) return;
      const L = window.L;
      const map = L.map(mapRef.current,{scrollWheelZoom:false}).setView([16.5,79.5],7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
      mapInst.current = map;
      addMarkers(map);
    }
    if (window.L) { init(); }
    else {
      const css = document.createElement('link'); css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
      const s = document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload=()=>init(); document.head.appendChild(s);
    }
  },[]);

  // Redraw markers when crop filter changes
  useEffect(()=>{
    if(mapInst.current) { mapInst.current.eachLayer(l=>{ if(l._icon||l._popup) mapInst.current.removeLayer(l); }); addMarkers(mapInst.current); }
  },[filterCrop]);

  function addMarkers(map) {
    const L = window.L;
    if(!L) return;
    MANDI_LOCATIONS.forEach(m=>{
      const price = m.prices[filterCrop] || 0;
      const isBest = price === Math.max(...MANDI_LOCATIONS.map(x=>x.prices[filterCrop]||0));
      const color = isBest ? '#1D9E75' : '#378ADD';
      const icon = L.divIcon({
        className:'',
        html:`<div style="background:${color};color:#fff;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;gap:4px">
          ${isBest?'⭐ ':''}₹${price.toLocaleString('en-IN')}
        </div>`,
        iconSize:[80,28], iconAnchor:[40,28],
      });
      const priceRows = Object.entries(m.prices).map(([c,p])=>`
        <tr><td class="crop">${c}</td><td class="price">₹${p.toLocaleString('en-IN')}</td></tr>
      `).join('');
      const popup = `
        <div style="font-family:DM Sans,sans-serif;min-width:180px">
          <div style="font-size:13px;font-weight:700;color:#085041;margin-bottom:6px">${m.name}</div>
          <div style="font-size:11px;color:#6B6B6B;margin-bottom:8px">📍 ${m.district} · Speciality: ${m.speciality}</div>
          <table class="mandi-popup-table">${priceRows}</table>
          <div style="font-size:10px;color:#6B6B6B;margin-top:6px">₹ per quintal · Updated today</div>
        </div>`;
      L.marker([m.lat,m.lng],{icon}).bindPopup(popup).addTo(map);
    });
  }

  // Best mandi for selected crop
  const bestMandi = MANDI_LOCATIONS.reduce((best,m)=> (m.prices[filterCrop]||0)>(best.prices[filterCrop]||0)?m:best, MANDI_LOCATIONS[0]);

  return(
    <div>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1rem',flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontSize:16,fontWeight:600}}>{TE?'సమీప మండీ మ్యాప్':'Nearest Mandi Finder'}</div>
          <div style={{fontSize:12,color:'var(--muted)',marginTop:3}}>{TE?'పిన్ క్లిక్ చేసి ధరలు చూడండి':'Click any pin to see today\'s prices'}</div>

function farmingAnswer(q, lang) {
