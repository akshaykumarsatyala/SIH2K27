// BUYER / SELLER PORTAL — separate logins for buyers and sellers.
// Sellers list their produce (crop, tons, mobile, email) and must download a
// PDF copy of the submitted details. Buyers browse the listings.
// Self-contained: only uses existing globals (sbClient, SUPABASE_READY, CROPS,
// DIST_AP, DIST_TS, fbLogOut, BuyerMatching). The role is kept in the
// Supabase user_metadata ("role": "seller" | "buyer").
//
// OPTIONAL — run once in Supabase → SQL editor so listings are shared between
// devices (without it, listings are stored only in this browser):
//
//   create table public.seller_listings (
//     id uuid default gen_random_uuid() primary key,
//     ref text unique not null,
//     seller_id uuid references auth.users on delete cascade,
//     seller_name text, crop text, tons numeric, price_per_qtl numeric,
//     district text, mobile text, email text,
//     created_at timestamptz default now()
//   );
//   alter table public.seller_listings enable row level security;
//   create policy "Sellers add own listings" on public.seller_listings
//     for insert with check (auth.uid() = seller_id);
//   create policy "Logged-in users read listings" on public.seller_listings
//     for select using (auth.role() = 'authenticated');
// ══════════════════════════════════════════════════════════════
const BP_ROLE={
  seller:{icon:'🌾',en:'Seller',te:'విక్రేత',enLong:'Seller (Farmer)',teLong:'విక్రేత (రైతు)'},
  buyer:{icon:'🏪',en:'Buyer',te:'కొనుగోలుదారు',enLong:'Buyer (Trader / Processor / FPO)',teLong:'కొనుగోలుదారు (వ్యాపారి / ప్రాసెసర్ / FPO)'},
};
const BP_LS='kd_bp_listings';
const BP_DEMO='kd_bp_demo_user'; // fake (no-authentication) demo login, stored only in this browser

function bpCleanPhone(s){
  let d=String(s||'').replace(/\D/g,'');
  if(d.length===12&&d.startsWith('91')) d=d.slice(2);
  if(d.length===11&&d.startsWith('0')) d=d.slice(1);
  return /^[6-9]\d{9}$/.test(d)?d:null;
}
const bpEmailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||'').trim());
function bpRef(){ return 'KD-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(); }
const bpToRow=l=>({ref:l.ref,seller_id:l.sellerId,seller_name:l.sellerName,crop:l.crop,tons:l.tons,price_per_qtl:l.pricePerQtl,district:l.district,mobile:l.mobile,email:l.email});
const bpFromRow=r=>({ref:r.ref,sellerId:r.seller_id,sellerName:r.seller_name,crop:r.crop,tons:Number(r.tons),pricePerQtl:r.price_per_qtl,district:r.district,mobile:r.mobile,email:r.email,createdAt:r.created_at});

function bpLocalListings(){ try{ return JSON.parse(localStorage.getItem(BP_LS)||'[]'); }catch{ return []; } }
async function bpFetchListings(){
  let remote=[];
  if(SUPABASE_READY){
    try{
      const {data,error}=await sbClient.from('seller_listings').select('*').order('created_at',{ascending:false});
      if(!error&&data) remote=data.map(bpFromRow);
    }catch(e){ console.warn('seller_listings not available, using local data', e); }
  }
  const seen=new Set(remote.map(r=>r.ref));
  return [...remote,...bpLocalListings().filter(l=>!seen.has(l.ref))]
    .sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
}
async function bpSaveListing(l){
  try{ localStorage.setItem(BP_LS,JSON.stringify([l,...bpLocalListings()].slice(0,200))); }catch{}
  if(!SUPABASE_READY||String(l.sellerId).startsWith('demo-')) return false; // demo users are local-only
  try{
    const {error}=await sbClient.from('seller_listings').insert(bpToRow(l));
    return !error;
  }catch{ return false; }
}

function bpLoadJsPDF(){
  return new Promise((res,rej)=>{
    if(window.jspdf) return res(window.jspdf);
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=()=>window.jspdf?res(window.jspdf):rej(new Error('PDF library failed to load'));
    s.onerror=()=>rej(new Error('Could not load the PDF library. Check your internet connection.'));
    document.head.appendChild(s);
  });
}

// Builds and downloads the seller's "security copy" of what they submitted
async function bpBuildPDF(l, accountEmail){
  const {jsPDF}=await bpLoadJsPDF();
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210, m=18;
  const c=s=>String(s==null?'':s).replace(/[^\x20-\x7E\u00A0-\u00FF]/g,'?'); // helvetica has no Telugu glyphs
  doc.setFillColor(8,80,65); doc.rect(0,0,W,36,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(21); doc.text('KrishiDost',m,16);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text('Seller Produce Declaration  -  Security Copy',m,26);

  const rows=[
    ['REFERENCE ID',l.ref],
    ['SUBMITTED ON',new Date(l.createdAt).toLocaleString('en-IN')],
    ['SELLER NAME',l.sellerName],
    ['CROP NAME',l.crop],
    ['QUANTITY (TONS)',String(l.tons)],
    ['EXPECTED PRICE (Rs. / QUINTAL)',l.pricePerQtl?String(l.pricePerQtl):'Not specified'],
    ['DISTRICT',l.district||'Not specified'],
    ['MOBILE NUMBER',l.mobile],
    ['EMAIL',l.email],
    ['LOGIN ACCOUNT',accountEmail||l.email],
  ];
  let y=52;
  rows.forEach(([k,v])=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(107,107,107); doc.text(k,m,y);
    doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(26,26,26); doc.text(c(v),m,y+6);
    doc.setDrawColor(225,225,225); doc.line(m,y+10,W-m,y+10);
    y+=17;
  });

  y+=2;
  doc.setFillColor(250,238,218); doc.roundedRect(m,y,W-2*m,34,3,3,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(99,56,6); doc.text('Why you received this document',m+4,y+8);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  const note='This is a copy of the exact details you submitted on KrishiDost. Keep it safe and check every detail. '
    +'If anything is wrong, or you did not submit this listing, contact KrishiDost support and quote the Reference ID above. '
    +'Never share your password or OTP with anyone.';
  doc.text(doc.splitTextToSize(note,W-2*m-8),m+4,y+15);

  doc.setFontSize(8); doc.setTextColor(140,140,140);
  doc.text('Generated by KrishiDost  |  '+c(l.ref)+'  |  Page 1 of 1',m,287);
  doc.save('KrishiDost_Seller_'+l.ref+'.pdf');
}

// ── Login / sign-up, one flow per role ──────────────────────────
function BuyerPortalAuth({lang,session,showToast,onDemo}){
  const TE=lang==='TE';
  const [role,setRole]=useState(null);
  const [mode,setMode]=useState('login');
  const [name,setName]=useState('');
  const [phone,setPhone]=useState('');
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [info,setInfo]=useState('');
  const R=role?BP_ROLE[role]:null;
  const rl=(r,long)=>TE?BP_ROLE[r][long?'teLong':'te']:BP_ROLE[r][long?'enLong':'en'];

  // Fake login: no server, no password check — whatever the user typed becomes the profile
  function demoLogin(msg){
    const em=email.trim()||'demo@krishidost.local';
    const u={id:'demo-'+em.toLowerCase(),email:em,user_metadata:{
      full_name:name.trim()||em.split('@')[0]||'Demo User',
      phone:bpCleanPhone(phone)||phone.replace(/\D/g,'').slice(-10),
      role}};
    try{ localStorage.setItem(BP_DEMO,JSON.stringify(u)); }catch{}
    onDemo&&onDemo(u);
    showToast&&showToast(msg||(TE?'డెమో లాగిన్ విజయవంతం':'Demo login successful'));
  }

  async function claim(r){ // already signed in through the normal login, but has no role yet
    setBusy(true); setErr('');
    try{
      const {error}=await sbClient.auth.updateUser({data:{role:r}});
      if(error) throw error;
      showToast&&showToast(TE?'ఖాతా సిద్ధమైంది':'Role saved');
    }catch(ex){ setErr(ex?.message||String(ex)); }
    finally{ setBusy(false); }
  }

  async function submit(e){
    e.preventDefault(); setErr(''); setInfo('');
    if(!SUPABASE_READY){ demoLogin(); return; }
    setBusy(true);
    try{
      if(mode==='signup'){
        if(!name.trim()) throw new Error(TE?'పేరు నమోదు చేయండి':'Please enter your name');
        if(!bpCleanPhone(phone)) throw new Error(TE?'సరైన 10 అంకెల మొబైల్ నంబర్ ఇవ్వండి':'Enter a valid 10-digit Indian mobile number');
        if(!bpEmailOk(email)) throw new Error(TE?'సరైన ఇమెయిల్ ఇవ్వండి':'Enter a valid email address');
        if(password.length<6) throw new Error(TE?'పాస్‌వర్డ్ కనీసం 6 అక్షరాలు ఉండాలి':'Password must be at least 6 characters');
        const {data,error}=await sbClient.auth.signUp({email:email.trim(),password,options:{data:{full_name:name.trim(),phone:bpCleanPhone(phone),role}}});
        if(error) throw error;
        if(!data.session){
          setInfo(TE?'ఖాతా సృష్టించబడింది. మీ ఇమెయిల్‌ను నిర్ధారించి, ఆపై లాగిన్ అవ్వండి.':'Account created. Please confirm the link sent to your email, then log in.');
          setMode('login'); setPassword('');
        } else showToast&&showToast(TE?'స్వాగతం!':'Welcome!');
      } else {
        const {data,error}=await sbClient.auth.signInWithPassword({email:email.trim(),password});
        if(error) throw error;
        const existing=data.user?.user_metadata?.role;
        if(existing&&existing!==role){
          await sbClient.auth.signOut();
          throw new Error(TE?`ఈ ఖాతా ${rl(existing)} గా నమోదైంది. దయచేసి ${rl(existing)} లాగిన్ వాడండి.`:`This account is registered as a ${rl(existing)}. Please use the ${rl(existing)} login instead.`);
        }
        if(!existing){ await sbClient.auth.updateUser({data:{role}}); }
        showToast&&showToast(TE?'స్వాగతం!':'Welcome back!');
      }
    }catch(ex){
      const msg=(ex?.message||String(ex)).trim();
      if(/failed to fetch|networkerror|load failed|network request/i.test(msg)){
        demoLogin(TE?'సర్వర్ అందుబాటులో లేదు — డెమో మోడ్‌లో ప్రవేశించారు':'Server unreachable, so you were signed in with demo mode');
      } else setErr(msg);
    }finally{ setBusy(false); }
  }

  return(
    <div className="page" style={{maxWidth:760}}>
      <style>{`
        .bp-roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        @media(max-width:560px){.bp-roles{grid-template-columns:1fr}}
        .bp-role{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:1.5rem 1.25rem;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);transition:all .18s}
        .bp-role:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
        .bp-role .ic{font-size:34px;margin-bottom:8px}
        .bp-role b{display:block;font-size:16px;margin-bottom:4px}
        .bp-role span{font-size:12.5px;color:var(--muted);line-height:1.5}
        .bp-formcard{max-width:420px;margin:0 auto}
        .bp-formcard input{width:100%;padding:10px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:10px;font-family:inherit}
        .bp-formcard input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.14)}
        .bp-info{background:var(--green-l);color:var(--green-d);font-size:12.5px;padding:8px 10px;border-radius:var(--rs);margin-bottom:10px}
      `}</style>

      <h2 style={{fontSize:22,fontWeight:600,marginBottom:4}}>🤝 {TE?'మార్కెట్‌ప్లేస్':'KrishiDost Marketplace'}</h2>
      <p style={{fontSize:13,color:'var(--muted)',marginBottom:'1.5rem'}}>
        {TE?'విక్రేతలు మరియు కొనుగోలుదారులకు వేర్వేరు లాగిన్.':'Separate logins for sellers and buyers. Choose how you want to continue.'}
      </p>

      {!role&&(
        <>
          {session&&(
            <div className="bp-info">
              {TE?`మీరు ${session.user.email} గా లాగిన్ అయ్యారు. ఈ ఖాతాను ఎలా ఉపయోగించాలో ఎంచుకోండి:`:`You're signed in as ${session.user.email}. Choose how to use this account in the marketplace:`}
            </div>
          )}
          {err&&<div className="auth-error">⚠️ {err}</div>}
          <div className="bp-roles">
            {['seller','buyer'].map(r=>(
              <button key={r} className="bp-role" disabled={busy} onClick={()=>session?claim(r):(setRole(r),setErr(''),setInfo(''))}>
                <div className="ic">{BP_ROLE[r].icon}</div>
                <b>{session?(TE?`${rl(r)} గా కొనసాగండి`:`Continue as ${rl(r)}`):(TE?`${rl(r)} లాగిన్`:`${rl(r)} login`)}</b>
                <span>{r==='seller'
                  ?(TE?'మీ పంట వివరాలను నమోదు చేసి, PDF కాపీ డౌన్‌లోడ్ చేయండి.':'List your crop, quantity and contact details, and get a PDF copy.')
                  :(TE?'నమోదైన రైతుల పంట జాబితాలను చూడండి.':'Browse produce listed by registered farmers.')}</span>
              </button>
            ))}
          </div>
        </>
      )}

      {role&&(
        <div className="card bp-formcard">
          <button type="button" className="btn btn-o" style={{marginBottom:14}} onClick={()=>{setRole(null);setErr('');setInfo('');}}>← {TE?'వెనుకకు':'Back'}</button>
          <div style={{fontSize:32}}>{R.icon}</div>
          <div style={{fontSize:18,fontWeight:700,margin:'4px 0 12px'}}>
            {rl(role)} {mode==='login'?(TE?'లాగిన్':'login'):(TE?'నమోదు':'sign up')}
          </div>
          <div className="auth-tabs">
            <div className={`auth-tab-thumb ${mode==='signup'?'signup':''}`}></div>
            <button type="button" className={mode==='login'?'active':''} onClick={()=>{setMode('login');setErr('');}}>{TE?'లాగిన్':'Log in'}</button>
            <button type="button" className={mode==='signup'?'active':''} onClick={()=>{setMode('signup');setErr('');}}>{TE?'నమోదు':'Sign up'}</button>
          </div>
          {err&&<div className="auth-error">⚠️ {err}</div>}
          {info&&<div className="bp-info">✅ {info}</div>}
          <form onSubmit={submit}>
            {mode==='signup'&&(
              <>
                <input placeholder={role==='buyer'?(TE?'వ్యాపారం / సంస్థ పేరు':'Business / trader name'):(TE?'పూర్తి పేరు':'Full name')} value={name} onChange={e=>setName(e.target.value)} required/>
                <input placeholder={TE?'మొబైల్ నంబర్ (10 అంకెలు)':'Mobile number (10 digits)'} inputMode="numeric" value={phone} onChange={e=>setPhone(e.target.value)} required/>
              </>
            )}
            <input type="email" placeholder={TE?'ఇమెయిల్':'Email'} value={email} onChange={e=>setEmail(e.target.value)} required/>
            <input type="password" placeholder={TE?'పాస్‌వర్డ్':'Password'} value={password} onChange={e=>setPassword(e.target.value)} required/>
            <button className="auth-submit" type="submit" disabled={busy}>
              {busy&&<span className="auth-spin"></span>}
              {busy?(TE?'దయచేసి వేచి ఉండండి...':'Please wait...'):mode==='login'?(TE?'లాగిన్':'Log in'):(TE?'ఖాతా సృష్టించు':'Create account')}
            </button>
          </form>
          <div style={{textAlign:'center',marginTop:14,paddingTop:14,borderTop:'1px solid var(--border)'}}>
            <button type="button" className="btn btn-o" onClick={()=>demoLogin()}>⚡ {TE?'డెమో లాగిన్ (ధృవీకరణ లేకుండా)':'Quick demo login (no verification)'}</button>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:6,lineHeight:1.5}}>
              {TE?'పైన నమోదు చేసిన వివరాలతో నేరుగా ప్రవేశిస్తుంది. సర్వర్ లేదా పాస్‌వర్డ్ తనిఖీ ఉండదు.':'Signs you in with whatever you typed above. No server or password check. Demo data stays in this browser.'}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Seller: enter produce details → PDF is downloaded → listing is saved ──
function SellerListingForm({lang,session,showToast}){
  const TE=lang==='TE';
  const meta=session.user.user_metadata||{};
  const [name,setName]=useState(meta.full_name||'');
  const [crop,setCrop]=useState(CROPS[0]);
  const [otherCrop,setOtherCrop]=useState('');
  const [tons,setTons]=useState('');
  const [price,setPrice]=useState('');
  const [district,setDistrict]=useState('');
  const [mobile,setMobile]=useState(meta.phone||'');
  const [email,setEmail]=useState(session.user.email||'');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [done,setDone]=useState(null);

  async function submit(e){
    e.preventDefault(); setErr('');
    const cropName=crop==='Other'?otherCrop.trim():crop;
    const t=Number(tons);
    const ph=bpCleanPhone(mobile);
    if(!name.trim()) return setErr(TE?'పేరు నమోదు చేయండి':'Please enter your name');
    if(!cropName) return setErr(TE?'పంట పేరు నమోదు చేయండి':'Please enter the crop name');
    if(!(t>0)||t>100000) return setErr(TE?'సరైన టన్నుల పరిమాణం ఇవ్వండి':'Enter a valid quantity in tons (greater than 0)');
    if(price&&!(Number(price)>0)) return setErr(TE?'సరైన ధర ఇవ్వండి':'Enter a valid price or leave it blank');
    if(!ph) return setErr(TE?'సరైన 10 అంకెల మొబైల్ నంబర్ ఇవ్వండి':'Enter a valid 10-digit Indian mobile number');
    if(!bpEmailOk(email)) return setErr(TE?'సరైన ఇమెయిల్ ఇవ్వండి':'Enter a valid email address');

    const listing={
      ref:bpRef(), sellerId:session.user.id, sellerName:name.trim(), crop:cropName, tons:t,
      pricePerQtl:price?Number(price):null, district, mobile:'+91 '+ph, email:email.trim(),
      createdAt:new Date().toISOString(),
    };
    setBusy(true);
    try{
      await bpBuildPDF(listing, session.user.email);   // download first — nothing is submitted without the PDF
    }catch(ex){
      setBusy(false);
      return setErr((TE?'PDF తయారు కాలేదు, కాబట్టి జాబితా సమర్పించబడలేదు: ':'The PDF could not be created, so the listing was not submitted: ')+(ex?.message||ex));
    }
    const remote=await bpSaveListing(listing);
    setBusy(false);
    setDone({listing,remote});
    showToast&&showToast(TE?'జాబితా సమర్పించబడింది, PDF డౌన్‌లోడ్ అయింది':'Listing submitted and PDF downloaded');
  }

  if(done){
    const l=done.listing;
    return(
      <div className="card" style={{textAlign:'center',maxWidth:520,margin:'0 auto'}}>
        <div style={{fontSize:44}}>✅</div>
        <div style={{fontSize:18,fontWeight:700,margin:'6px 0'}}>{TE?'మీ జాబితా సమర్పించబడింది':'Your listing is submitted'}</div>
        <p style={{fontSize:13,color:'var(--muted)',lineHeight:1.6}}>
          {TE?'మీరు నమోదు చేసిన వివరాల PDF కాపీ డౌన్‌లోడ్ అయింది. దాన్ని భద్రంగా ఉంచండి.':'A PDF copy of the details you entered has been downloaded. Please keep it safe. If it did not download, use the button below.'}
        </p>
        <div style={{background:'var(--bg)',borderRadius:'var(--rs)',padding:'10px 12px',margin:'12px 0',fontSize:13}}>
          {TE?'రిఫరెన్స్ ID':'Reference ID'}: <b style={{fontFamily:"'DM Mono',monospace"}}>{l.ref}</b>
          <div style={{color:'var(--muted)',marginTop:2}}>{l.crop} · {l.tons} {TE?'టన్నులు':'tons'}</div>
        </div>
        {!done.remote&&<p style={{fontSize:11.5,color:'var(--amber-d)',background:'var(--amber-l)',borderRadius:'var(--rs)',padding:'6px 10px',marginBottom:10}}>
          {TE?'ఈ పరికరంలో మాత్రమే సేవ్ అయింది (Supabase టేబుల్ ఇంకా సెటప్ చేయలేదు).':'Saved on this device only (the Supabase seller_listings table isn\'t set up yet).'}
        </p>}
        <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
          <button className="btn btn-p" onClick={()=>bpBuildPDF(l,session.user.email).catch(x=>setErr(String(x.message||x)))}>⬇️ {TE?'PDF మళ్లీ డౌన్‌లోడ్':'Download PDF again'}</button>
          <button className="btn btn-o" onClick={()=>{setDone(null);setTons('');setPrice('');}}>➕ {TE?'మరో పంట జోడించు':'Add another crop'}</button>
        </div>
      </div>
    );
  }

  return(
    <form className="card bp-sform" onSubmit={submit}>
      <style>{`
        .bp-sform .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
        .bp-sform label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
        .bp-sform input,.bp-sform select{width:100%;padding:9px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit}
        .bp-sform input:focus,.bp-sform select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.14)}
      `}</style>
      <div className="card-title">🌾 {TE?'మీ పంట వివరాలు':'Enter your produce details'}</div>
      {err&&<div className="auth-error">⚠️ {err}</div>}
      <div className="g">
        <div><label>{TE?'మీ పేరు':'Your name'}</label><input value={name} onChange={e=>setName(e.target.value)} required/></div>
        <div>
          <label>{TE?'పంట పేరు':'Crop name'}</label>
          <select value={crop} onChange={e=>setCrop(e.target.value)}>
            {CROPS.map(c=><option key={c}>{c}</option>)}
            <option value="Other">{TE?'ఇతర':'Other'}</option>
          </select>
        </div>
        {crop==='Other'&&<div><label>{TE?'పంట పేరు నమోదు':'Type crop name'}</label><input value={otherCrop} onChange={e=>setOtherCrop(e.target.value)} maxLength={40} required/></div>}
        <div><label>{TE?'పంట పరిమాణం (టన్నులు)':'Crop quantity (tons)'}</label><input type="number" min="0" step="0.01" value={tons} onChange={e=>setTons(e.target.value)} required/></div>
        <div><label>{TE?'కావలసిన ధర ₹/క్వింటాల్ (ఐచ్ఛికం)':'Expected ₹ / quintal (optional)'}</label><input type="number" min="0" value={price} onChange={e=>setPrice(e.target.value)}/></div>
        <div>
          <label>{TE?'జిల్లా':'District'}</label>
          <select value={district} onChange={e=>setDistrict(e.target.value)}>
            <option value="">{TE?'ఎంచుకోండి':'Select district'}</option>
            <optgroup label="Andhra Pradesh">{DIST_AP.map(d=><option key={d}>{d}</option>)}</optgroup>
            <optgroup label="Telangana">{DIST_TS.map(d=><option key={d}>{d}</option>)}</optgroup>
          </select>
        </div>
        <div><label>{TE?'మొబైల్ నంబర్':'Mobile number'}</label><input inputMode="numeric" placeholder="98XXXXXXXX" value={mobile} onChange={e=>setMobile(e.target.value)} required/></div>
        <div><label>{TE?'ఇమెయిల్':'Email'}</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required/></div>
      </div>
      <p style={{fontSize:12,color:'var(--muted)',margin:'14px 0 12px',lineHeight:1.6}}>
        🔒 {TE?'భద్రత కోసం, సమర్పించిన వెంటనే మీరు నమోదు చేసిన వివరాల PDF డౌన్‌లోడ్ అవుతుంది.':'For your security, a PDF copy of the details you entered is downloaded as soon as you submit. Registered buyers can see this listing and your contact details.'}
      </p>
      <button className="btn btn-p" type="submit" disabled={busy}>
        {busy?(TE?'తయారవుతోంది...':'Preparing PDF...'):`⬇️ ${TE?'సమర్పించి PDF డౌన్‌లోడ్ చేయి':'Submit & download PDF'}`}
      </button>
    </form>
  );
}

function BpListingCard({l,TE,seller,onPdf}){
  return(
    <div className="card" style={{marginBottom:'.75rem',display:'flex',gap:14,justifyContent:'space-between',flexWrap:'wrap',alignItems:'center'}}>
      <div style={{flex:'1 1 240px'}}>
        <div style={{fontSize:16,fontWeight:600}}>🌾 {l.crop} <span style={{color:'var(--green)'}}>· {l.tons} {TE?'టన్నులు':'tons'}</span></div>
        <div style={{fontSize:12,color:'var(--muted)',marginTop:4,display:'flex',gap:12,flexWrap:'wrap'}}>
          <span>👤 {l.sellerName}</span>
          {l.district&&<span>📍 {l.district}</span>}
          {l.pricePerQtl&&<span>₹{Number(l.pricePerQtl).toLocaleString('en-IN')}/{TE?'క్వి':'qtl'}</span>}
          <span>🕒 {new Date(l.createdAt).toLocaleDateString('en-IN')}</span>
        </div>
        <div style={{fontSize:11,color:'var(--muted)',marginTop:4,fontFamily:"'DM Mono',monospace"}}>{l.ref}</div>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {seller?(
          <button className="btn btn-o" onClick={onPdf}>⬇️ PDF</button>
        ):(
          <>
            <a className="btn btn-p" style={{textDecoration:'none'}} href={`tel:${String(l.mobile).replace(/\s/g,'')}`}>📞 {l.mobile}</a>
            <a className="btn btn-o" style={{textDecoration:'none'}} href={`mailto:${l.email}`}>✉️ {TE?'ఇమెయిల్':'Email'}</a>
          </>
        )}
      </div>
    </div>
  );
}

function SellerMyListings({lang,session,showToast}){
  const TE=lang==='TE';
  const [rows,setRows]=useState(null);
  useEffect(()=>{ bpFetchListings().then(all=>setRows(all.filter(l=>l.sellerId===session.user.id))); },[]);
  if(!rows) return <div className="card hempty">{TE?'లోడ్ అవుతోంది...':'Loading...'}</div>;
  if(!rows.length) return <div className="card hempty"><div style={{fontSize:40}}>📭</div>{TE?'ఇంకా జాబితాలు లేవు.':'You haven\'t listed any produce yet.'}</div>;
  return <>{rows.map(l=><BpListingCard key={l.ref} l={l} TE={TE} seller onPdf={()=>bpBuildPDF(l,session.user.email).catch(x=>showToast&&showToast(String(x.message||x)))}/>)}</>;
}

function BuyerBrowse({lang}){
  const TE=lang==='TE';
  const [rows,setRows]=useState(null);
  const [cropF,setCropF]=useState('All');
  const [q,setQ]=useState('');
  const load=()=>{ setRows(null); bpFetchListings().then(setRows); };
  useEffect(load,[]);
  const crops=['All',...Array.from(new Set([...CROPS,...(rows||[]).map(r=>r.crop)]))];
  const shown=(rows||[]).filter(l=>(cropF==='All'||l.crop===cropF)&&(!q.trim()||(l.district||'').toLowerCase().includes(q.trim().toLowerCase())||l.sellerName.toLowerCase().includes(q.trim().toLowerCase())));
  return(
    <>
      <div className="card">
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}}>
          <div className="hfilt" style={{margin:0}}>
            {crops.map(c=><button key={c} className={`hf${cropF===c?' active':''}`} onClick={()=>setCropF(c)}>{c==='All'?(TE?'అన్నీ':'All'):c}</button>)}
          </div>
          <div style={{display:'flex',gap:8}}>
            <input className="sel-inp" style={{cursor:'text'}} placeholder={TE?'జిల్లా / విక్రేత శోధన':'Search district / seller'} value={q} onChange={e=>setQ(e.target.value)}/>
            <button className="btn btn-o" onClick={load}>🔄</button>
          </div>
        </div>
      </div>
      {!rows&&<div className="card hempty">{TE?'లోడ్ అవుతోంది...':'Loading listings...'}</div>}
      {rows&&!shown.length&&<div className="card hempty"><div style={{fontSize:40}}>🔎</div>{TE?'జాబితాలు కనుగొనబడలేదు.':'No produce listings found yet.'}</div>}
      {shown.map(l=><BpListingCard key={l.ref} l={l} TE={TE}/>)}
    </>
  );
}

// ── Entry point used by the "Marketplace" tab ──
function BuyerPortal({lang,showToast}){
  const TE=lang==='TE';
  const [sbSession,setSession]=useState(null);
  const [demoUser,setDemoUser]=useState(()=>{ try{ return JSON.parse(localStorage.getItem(BP_DEMO)||'null'); }catch{ return null; } });
  const session=sbSession||(demoUser?{user:demoUser}:null);
  const [ready,setReady]=useState(!SUPABASE_READY);
  const [tab,setTab]=useState(null);

  useEffect(()=>{
    if(!SUPABASE_READY) return;
    sbClient.auth.getSession().then(({data})=>{ setSession(data.session); setReady(true); }).catch(()=>setReady(true));
    const {data:sub}=sbClient.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  useEffect(()=>{ setTab(null); },[session?.user?.id]);

  const meta=session?.user?.user_metadata||{};
  const role=(meta.role==='seller'||meta.role==='buyer')?meta.role:null;

  if(!ready) return <div className="page"><div className="card hempty">{TE?'లోడ్ అవుతోంది...':'Loading...'}</div></div>;
  if(!session||!role) return <BuyerPortalAuth lang={lang} session={sbSession} showToast={showToast} onDemo={setDemoUser}/>;

  const cur=tab||(role==='seller'?'add':'browse');
  const tabs=role==='seller'
    ?[['add',`➕ ${TE?'పంట జోడించు':'List produce'}`],['mine',`📄 ${TE?'నా జాబితాలు':'My listings'}`],['match',`🤝 ${TE?'కొనుగోలుదారులను కనుగొను':'Find buyers'}`]]
    :[['browse',`🌾 ${TE?'పంట జాబితాలు':'Browse produce'}`]];

  async function logout(){
    if(!sbSession&&demoUser){ try{ localStorage.removeItem(BP_DEMO); }catch{} setDemoUser(null); showToast&&showToast(TE?'లాగ్అవుట్ అయ్యారు':'Logged out'); return; }
    try{ await fbLogOut(); showToast&&showToast(TE?'లాగ్అవుట్ అయ్యారు':'Logged out'); }catch(e){ console.warn(e); }
  }

  return(
    <>
      <div className="page" style={{paddingBottom:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap',marginBottom:'1rem'}}>
          <div>
            <h2 style={{fontSize:22,fontWeight:600}}>{BP_ROLE[role].icon} {TE?BP_ROLE[role].te:BP_ROLE[role].en} {TE?'డాష్‌బోర్డ్':'Dashboard'}</h2>
            <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{meta.full_name||session.user.email}</div>
          </div>
          <button className="btn btn-o" onClick={logout}>↩ {TE?'లాగ్అవుట్':'Log out'}</button>
        </div>
        {tabs.length>1&&(
          <div className="tabs">
            {tabs.map(([id,l])=><div key={id} className={`tab${cur===id?' active':''}`} onClick={()=>setTab(id)}>{l}</div>)}
          </div>
        )}
        {cur==='add'&&<SellerListingForm lang={lang} session={session} showToast={showToast}/>}
        {cur==='mine'&&<SellerMyListings lang={lang} session={session} showToast={showToast}/>}
        {cur==='browse'&&<BuyerBrowse lang={lang}/>}
      </div>
      {cur==='match'&&<BuyerMatching lang={lang} showToast={showToast}/>}
    </>
  );
}

function App(){
  const [tab,setTab]=useState('home');
  const [lang,setLang]=useState('EN');
  const [toast,setToast]=useState(null);
  // ── Pest reports — lifted here so Home's Early Warning panel and the
  // Pest Map tab both see the same live data (a report submitted on the
  // Pest Map tab immediately shows up as a Home-page warning too) ──
  const [reports,setReports]=useState(MOCK_REPORTS);
  // ── Dark mode state — persists in localStorage ──
  const [dark,setDark]=useState(()=>{
    try{ return localStorage.getItem('kd_dark')==='1'; }catch{ return false; }
  });

  // ── Splash / loading-animation state ──
  const [showSplash,setShowSplash]=useState(true);
  const [splashProgress,setSplashProgress]=useState(6);
  const [navLoading,setNavLoading]=useState(false);

  // ── Auth state ──
  const [user,setUser]=useState(null);
  const [authChecked,setAuthChecked]=useState(!SUPABASE_READY);
  const [showAuth,setShowAuth]=useState(false);

  // Apply/remove dark class on body whenever dark changes
  useEffect(()=>{
    document.body.classList.toggle('dark', dark);
    try{ localStorage.setItem('kd_dark', dark?'1':'0'); }catch{}
  },[dark]);

  // Simulate a slow, uneven "government portal" style load: quick burst, then a
  // couple of stalls, before finally settling — instead of an instant flash.
  useEffect(()=>{
    const steps = [
      {at:150,  to:16},
      {at:450,  to:29},
      {at:1400, to:33},   // stall — feels like a slow server round-trip
      {at:2000, to:52},
      {at:2650, to:56},   // second stall
      {at:3300, to:78},
      {at:3900, to:93},
      {at:4400, to:100},
    ];
    const timers = steps.map(s=>setTimeout(()=>setSplashProgress(s.to), s.at));
    const hideT = setTimeout(()=>setShowSplash(false), 4900);
    return ()=>{ timers.forEach(clearTimeout); clearTimeout(hideT); };
  },[]);

  // Brief top-loading-bar animation whenever the user switches tabs
  useEffect(()=>{
    setNavLoading(true);
    const t=setTimeout(()=>setNavLoading(false), 350);
    return ()=>clearTimeout(t);
  },[tab]);

  // Keep the user logged in across refreshes via Supabase's auth listener
  useEffect(()=>{
    if (!SUPABASE_READY) return;
    // Pick up any existing session on load (e.g. after a page refresh)
    sbClient.auth.getSession().then(({data})=>{
      setUser(normalizeSbUser(data.session?.user));
      setAuthChecked(true);
    });
    const { data: sub } = sbClient.auth.onAuthStateChange((_event, session)=>{
      setUser(normalizeSbUser(session?.user));
      setAuthChecked(true);
    });
    return ()=>sub.subscription.unsubscribe();
  },[]);

  async function handleLogout(){
    try{ await fbLogOut(); setToast(lang==='TE'?'లాగ్అవుట్ అయ్యారు':'Logged out'); }
    catch(e){ console.warn(e); }
  }

  return(
    <>
      <SplashScreen visible={showSplash} lang={lang} progress={splashProgress}/>
      <TopLoader active={navLoading}/>
      <Nav tab={tab} setTab={setTab} lang={lang} setLang={setLang} dark={dark} setDark={setDark}
           user={user} onLoginClick={()=>setShowAuth(true)} onLogout={handleLogout}/>
      {tab==='home'&&<Home setTab={setTab} lang={lang} reports={reports} user={user} onLoginClick={()=>setShowAuth(true)}/>}
      {tab==='storage'&&<ProcessingStorageRecommendation lang={lang} showToast={setToast}/>}
      {tab==='monitor'&&<CropMonitoring lang={lang} showToast={setToast}/>}
      {tab==='harvest'&&<HarvestPrediction lang={lang} showToast={setToast}/>}
      {tab==='quality'&&<QualityGrading lang={lang} showToast={setToast}/>}
      {tab==='prices'&&<Prices lang={lang} showToast={setToast}/>}
      {tab==='crop'&&<CropRecommendation lang={lang} showToast={setToast}/>}
      {tab==='schemes'&&<GovtSchemes lang={lang} showToast={setToast}/>}
      {tab==='insurance'&&<CropInsurance lang={lang} showToast={setToast}/>}
      {tab==='pest'&&<PestMap lang={lang} showToast={setToast} reports={reports} setReports={setReports}/>}
      {tab==='buyers'&&<BuyerPortal lang={lang} showToast={setToast}/>}
      {tab==='support'&&<FarmerSupport lang={lang}/>}
      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
      {showAuth && (
        <AuthModal lang={lang} onClose={()=>setShowAuth(false)}
          onAuthed={(u)=>{ setUser(u); setShowAuth(false); setToast(lang==='TE'?'స్వాగతం!':'Welcome!'); }}/>
      )}
      {/* ── Floating chatbot — visible on all pages ── */}
      <Chatbot lang={lang}/>
      <Footer lang={lang} setTab={setTab}/>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
